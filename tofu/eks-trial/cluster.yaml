# The smallest EKS cluster that can run the smoke test.
#
# Deliberately not part of `tofu/`: that describes the real thing. This exists to answer one
# question — does `deploy/` work on EKS the way it works on GKE and AKS — and is destroyed
# afterwards. EKS charges $0.10/hour for the control plane whether or not anything is running on it,
# which is the whole reason this is a file you can point `eksctl delete` at rather than a cluster
# somebody remembers to clean up.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: sproutos-trial
  region: us-east-1
  version: "1.34"

# The VPC CNI does **not** enforce NetworkPolicy unless told to. Left at the default, every
# NetworkPolicy in `deploy/tenant/` would be accepted and ignored — which is precisely the failure
# `kind`'s default CNI produced, and the reason the smoke test asserts isolation in both directions
# rather than only checking that the app answers.
addons:
  - name: vpc-cni
    configurationValues: |
      {"enableNetworkPolicy": "true"}
  - name: coredns
  - name: kube-proxy

managedNodeGroups:
  - name: trial
    # `m7i-flex.large`, and the constraint that picks it is not performance.
    #
    # This account is on the AWS free plan, which **restricts EC2 to free-tier-eligible instance
    # types at the account level**. A `t3.medium` node group is accepted by the API, spends fifteen
    # minutes in CREATING, and then fails with `The specified instance type is not eligible for Free
    # Tier` — an error that appears only in the node group's health issues, not in CloudFormation and
    # not in eksctl's output, which had already timed out waiting by then.
    #
    # Of the eligible types, this one has 2 vCPU and 8 GiB: Knative, Kourier and the platform's own
    # pods do not fit alongside the kubelet in a `t3.small`'s 2 GiB, and a node that cannot schedule
    # the gateway fails the test for a reason that has nothing to do with the code.
    instanceType: m7i-flex.large
    desiredCapacity: 2
    volumeSize: 20
    volumeType: gp3
    privateNetworking: false
