[package]
name = "sprout-cli"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The canonical command-line client for SproutOS"

[[bin]]
name = "sprout"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
base64.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
keyring = { version = "3.6", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
  "vendored",
] }
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sprout-core = { path = "../sprout-core" }
thiserror.workspace = true
tokio.workspace = true
url = { version = "2.5", features = ["serde"] }
uuid.workspace = true
webbrowser = "1"
zeroize = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
