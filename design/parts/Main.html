<div style="width: 1280px; height: 800px; display: flex; background: var(--background)">
  <!-- Sidebar -->
  <aside
    style="
      width: 232px;
      flex-shrink: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--sidebar-border);
      display: flex;
      flex-direction: column;
    "
  >
    <!-- Team switcher -->
    <div style="padding: 12px; border-bottom: 1px solid var(--sidebar-border)">
      <button
        style="
          width: 100%;
          height: 40px;
          display: flex;
          align-items: center;
          gap: 9px;
          padding: 0 8px;
          border: 0;
          border-radius: var(--radius);
          background: transparent;
          color: var(--foreground);
          text-align: left;
          font-family: var(--font-sans);
        "
      >
        <span
          style="
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            border-radius: 7px;
            background: var(--leaf);
            color: var(--primary-foreground);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
          "
          >A</span
        >
        <span style="display: flex; flex-direction: column; min-width: 0; flex: 1">
          <span
            style="
              font-size: 13px;
              font-weight: 500;
              white-space: nowrap;
              overflow: hidden;
              text-overflow: ellipsis;
            "
            >Andrew's Team</span
          >
          <span style="font-size: 11px; color: var(--muted-foreground)">Owner</span>
        </span>
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          style="color: var(--muted-foreground); flex-shrink: 0"
        >
          <path d="m7 15 5 5 5-5"></path>
          <path d="m7 9 5-5 5 5"></path>
        </svg>
      </button>
    </div>

    <!-- Nav -->
    <nav style="flex: 1; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px">
      <div
        style="
          height: 32px;
          display: flex;
          align-items: center;
          gap: 9px;
          padding: 0 9px;
          border-radius: 8px;
          background: var(--secondary);
          color: var(--foreground);
          font-size: 13px;
          font-weight: 500;
        "
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="var(--leaf)"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect width="7" height="9" x="3" y="3" rx="1"></rect>
          <rect width="7" height="5" x="14" y="3" rx="1"></rect>
          <rect width="7" height="9" x="14" y="12" rx="1"></rect>
          <rect width="7" height="5" x="3" y="16" rx="1"></rect>
        </svg>
        Projects
      </div>
      <div
        style="
          height: 32px;
          display: flex;
          align-items: center;
          gap: 9px;
          padding: 0 9px;
          border-radius: 8px;
          color: var(--muted-foreground);
          font-size: 13px;
        "
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 2v20"></path>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
        Workflows
      </div>
      <div
        style="
          height: 32px;
          display: flex;
          align-items: center;
          gap: 9px;
          padding: 0 9px;
          border-radius: 8px;
          color: var(--muted-foreground);
          font-size: 13px;
        "
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
          <path d="M3 5v14a9 3 0 0 0 18 0V5"></path>
          <path d="M3 12a9 3 0 0 0 18 0"></path>
        </svg>
        Databases
      </div>
      <div
        style="
          height: 32px;
          display: flex;
          align-items: center;
          gap: 9px;
          padding: 0 9px;
          border-radius: 8px;
          color: var(--muted-foreground);
          font-size: 13px;
        "
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m8 6 4-4 4 4"></path>
          <path d="M12 2v10.3a4 4 0 0 1-1.172 2.872L4 22"></path>
          <path d="m20 22-5-5"></path>
        </svg>
        Store
      </div>

      <div style="height: 1px; background: var(--sidebar-border); margin: 10px 9px"></div>

      <div
        style="
          height: 32px;
          display: flex;
          align-items: center;
          gap: 9px;
          padding: 0 9px;
          border-radius: 8px;
          color: var(--muted-foreground);
          font-size: 13px;
        "
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2 12h20"></path>
          <path d="M12 2v20"></path>
          <circle cx="12" cy="12" r="10"></circle>
        </svg>
        Observability
      </div>
      <div
        style="
          height: 32px;
          display: flex;
          align-items: center;
          gap: 9px;
          padding: 0 9px;
          border-radius: 8px;
          color: var(--muted-foreground);
          font-size: 13px;
        "
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
          ></path>
        </svg>
        Settings
      </div>
    </nav>

    <!-- Credit balance. Amber, because it is money. -->
    <div
      style="
        margin: 8px;
        padding: 11px 12px;
        border-radius: var(--radius);
        background: var(--soil-800);
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 7px;
      "
    >
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span class="eyebrow" style="font-size: 10px">Balance</span>
        <span class="money" style="font-size: 15px; font-weight: 500">$4.13</span>
      </div>
      <div style="height: 3px; border-radius: 2px; background: var(--soil-700); overflow: hidden">
        <div style="width: 41%; height: 100%; background: var(--husk)"></div>
      </div>
      <span style="font-size: 11px; color: var(--muted-foreground)">~31 days at current burn</span>
    </div>
  </aside>

  <!-- Main -->
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <header
      style="
        height: 52px;
        flex-shrink: 0;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
      "
    >
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="font-size: 15px; font-weight: 600">Projects</span>
        <span
          class="tnum"
          style="
            font-size: 12px;
            color: var(--muted-foreground);
            background: var(--secondary);
            padding: 1px 7px;
            border-radius: 999px;
          "
          >4</span
        >
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <div
          style="
            height: 32px;
            width: 220px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--soil-800);
          "
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="var(--muted-foreground)"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <span style="font-size: 13px; color: var(--muted-foreground)">Search projects</span>
        </div>
        <div
          style="
            height: 32px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 12px;
            border-radius: var(--radius);
            background: var(--primary);
            color: var(--primary-foreground);
            font-size: 13px;
            font-weight: 500;
          "
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <path d="M5 12h14"></path>
            <path d="M12 5v14"></path>
          </svg>
          New project
        </div>
      </div>
    </header>

    <div
      style="
        flex: 1;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow: hidden;
      "
    >
      <sc-for list="{{projects}}" as="p" hint-placeholder-count="4">
        <div
          style="
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--card);
          "
        >
          <span
            style="
              width: 34px;
              height: 34px;
              flex-shrink: 0;
              border-radius: 9px;
              background: var(--soil-700);
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 15px;
            "
            >{{p.glyph}}</span
          >

          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="font-size: 14px; font-weight: 500">{{p.name}}</span>
              <span
                style="font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid {{p.statusBorder}}; color: {{p.statusColor}}; background: {{p.statusBg}}"
                >{{p.status}}</span
              >
            </div>
            <span class="tnum" style="font-size: 11.5px; color: var(--muted-foreground)"
              >{{p.repo}}</span
            >
          </div>

          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: flex-end;
              gap: 3px;
              width: 108px;
            "
          >
            <span class="money" style="font-size: 13px">{{p.cost}}</span>
            <span style="font-size: 11px; color: var(--muted-foreground)">this month</span>
          </div>

          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: flex-end;
              gap: 3px;
              width: 100px;
            "
          >
            <span style="font-size: 12px; color: var(--muted-foreground)">{{p.updated}}</span>
            <span class="tnum" style="font-size: 11px; color: var(--muted-foreground)"
              >{{p.region}}</span
            >
          </div>

          <sc-if value="{{p.hasUpdate}}" hint-placeholder-val="{{true}}">
            <div
              style="
                height: 28px;
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 0 10px;
                border-radius: 8px;
                border: 1px solid var(--leaf);
                color: var(--leaf);
                font-size: 12px;
                font-weight: 500;
              "
            >
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
              </svg>
              Upstream
            </div>
          </sc-if>

          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="var(--muted-foreground)"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="1"></circle>
            <circle cx="12" cy="5" r="1"></circle>
            <circle cx="12" cy="19" r="1"></circle>
          </svg>
        </div>
      </sc-for>
    </div>
  </div>
</div>
