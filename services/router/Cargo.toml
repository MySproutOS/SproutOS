[package]
name = "router"
description = "The front door: resolves a hostname to a Lambda and invokes it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-lambda = "1"
axum.workspace = true
base64.workspace = true
bytes.workspace = true
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "aio", "connection-manager"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-lambda = "1"
aws-sdk-s3 = "1"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "aio", "connection-manager"] }
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
# A zip writer for the fixture function. Lambda takes a zip and Rust's std has none.
zip = { version = "2", default-features = false, features = ["deflate"] }
