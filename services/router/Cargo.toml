[package]
name = "router"
description = "The front door: resolves a hostname to a Lambda and invokes it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
# For the one trait the log producer is behind, so the drain loop is testable without a broker.
async-trait = "0.1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-lambda = "1"
axum.workspace = true
base64.workspace = true
bytes.workspace = true
reqwest.workspace = true
# `tokio-rustls-comp` is not optional: the platform Valkey is ElastiCache with
# `TransitEncryptionMode = required`, so its URL is `rediss://` and a client built without TLS
# refuses it at parse time — "can't connect with TLS, the feature is not enabled". That surfaces as
# a router that exits on start, an instance that never answers `/healthz`, and an Auto Scaling
# group replacing it every three minutes.
redis = { version = "0.27", default-features = false, features = [
  "tokio-comp",
  "aio",
  "connection-manager",
  "tls-rustls",
  "tokio-rustls-comp",
  "tls-rustls-webpki-roots",
] }
# Direct, only so `main` can name a provider — see the `install_default` call there. Both providers
# are already in the graph via the AWS SDK and redis; nothing here adds one.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
# The router now owns the only Kafka connection in the platform — it used to be one per Lambda
# sandbox. lz4 because runtime log text compresses to a fraction of itself and this crosses the
# public internet to OVH.
rskafka = { version = "0.6", default-features = false, features = [
  "compression-lz4",
  "transport-tls",
] }
webpki-roots = "1"
# The log token's HMAC, verifying what `apps/internal-api/src/v1/deploy.ts` mints. `base64` is
# already a dependency above — the token's signature is base64url, the same encoding Node's
# `digest("base64url")` produces.
hmac = "0.12"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
pg-proxy = { path = "../pg-proxy" }
search-proxy = { path = "../search-proxy" }
serde.workspace = true
serde_json.workspace = true
sproutos-llm-proxy.workspace = true
sproutos-service-credentials.workspace = true
valkey-proxy = { path = "../valkey-proxy" }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-lambda = "1"
aws-sdk-s3 = "1"
reqwest.workspace = true
# `tokio-rustls-comp` is not optional: the platform Valkey is ElastiCache with
# `TransitEncryptionMode = required`, so its URL is `rediss://` and a client built without TLS
# refuses it at parse time — "can't connect with TLS, the feature is not enabled". That surfaces as
# a router that exits on start, an instance that never answers `/healthz`, and an Auto Scaling
# group replacing it every three minutes.
redis = { version = "0.27", default-features = false, features = [
  "tokio-comp",
  "aio",
  "connection-manager",
  "tls-rustls",
  "tokio-rustls-comp",
  "tls-rustls-webpki-roots",
] }
serde_json.workspace = true
tokio.workspace = true
# A zip writer for the fixture function. Lambda takes a zip and Rust's std has none.
zip = { version = "2", default-features = false, features = ["deflate"] }
