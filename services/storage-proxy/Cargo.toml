[package]
name = "storage-proxy"
description = "Tenant-split S3 proxy: SigV4 in, SigV4 out"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crc32fast.workspace = true
futures-util.workspace = true
hex.workspace = true
reqwest.workspace = true
redis = { version = "0.27", default-features = false, features = [
  "tokio-comp",
  "aio",
  "connection-manager",
  "tls-rustls",
  "tokio-rustls-comp",
  "tls-rustls-webpki-roots",
] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
sproutos-llm-proxy.workspace = true
sproutos-metering-proto.workspace = true
sha2.workspace = true
sproutos-s3-sigv4.workspace = true
sproutos-service-credentials.workspace = true
sproutos-tenant-auth.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true
