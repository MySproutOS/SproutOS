[package]
name = "log-extension"
description = "Lambda extension: Telemetry API to Kafka"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
reqwest.workspace = true
# No Kafka client here any more.
#
# This used to hold `rskafka` and `rustls` and talk to a broker directly. It does not, because doing
# so required a Kafka credential inside every customer's execution environment — readable by their
# own code, and authorized to write a topic every tenant shares. `sink.rs` explains the rest. What
# remains is an HTTP client posting to the router, which owns the one connection.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true
