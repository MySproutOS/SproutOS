[package]
name = "sproutos-llm-proxy"
description = "Opening the seal between the control plane and the LLM proxy, and counting tokens out of a model response"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = "0.10"
anyhow.workspace = true
axum.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
# `stream` on top of the workspace features: this is the only caller that reads a response as it
# arrives rather than as one buffer, which is the difference between an agent watching tokens
# appear and one watching nothing for a minute.
reqwest = { workspace = true, features = ["stream"] }
base64.workspace = true
bytes.workspace = true
deadpool-postgres.workspace = true
serde.workspace = true
sproutos-metering-proto.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sproutos-service-credentials.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tracing.workspace = true

[dev-dependencies]
# The end-to-end test seeds and cleans its own rows, and talks plain TCP to the compose Postgres —
# the production path goes through `SessionStore`, which requires TLS.
tokio-postgres.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
