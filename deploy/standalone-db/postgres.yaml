# The control-plane Postgres, for a cluster that does not have a managed one.
#
# This is the database holding every user, session, organization, credential and ledger entry — the
# whole control plane. On AWS it is RDS and this file is not applied; on a trial cluster, a GKE or
# AKS free tier, or anywhere `tofu` has not yet built a managed instance, this is what stands in.
#
# **It was an `emptyDir`.** Not in this file — this file did not exist. The StatefulSet was applied
# once from a scratch manifest with `emptyDir: {}` as its data volume, ran for nine hours, and then
# the pod was rescheduled onto another node and every row went with it: users, sessions, the
# organizations, the store listings, the ledger, the sandbox rows, the whole verified end-to-end
# state. Nothing warned. The first symptom was a 503 on `/v1/user` an hour later.
#
# What made it survive that long unnoticed is written above the retention policy below.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-db
  labels:
    app.kubernetes.io/part-of: sproutos
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: platform-db
  labels:
    app.kubernetes.io/part-of: sproutos
spec:
  # Headless: a StatefulSet's pod needs a stable DNS name, and the control plane connects to the one
  # replica by the service name either way.
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: platform-db
  labels:
    app.kubernetes.io/part-of: sproutos
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  # Keep the volume when the StatefulSet is deleted or scaled to zero.
  #
  # This was set on the original too, sitting directly above `emptyDir: {}` — a retention policy for
  # a PersistentVolumeClaim that did not exist. It reads, in a manifest review, exactly like the
  # durability it is not: everything a reader looks for as evidence the data is safe was present,
  # and the one line that mattered said the storage was the node's scratch space. That is why this
  # is the only place the two appear together, and why the claim template below is right beneath it.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # Small: this is a control plane, not a data plane — tenants' rows live in tenant
            # databases. `standard-rwo` on GKE and `default` on AKS both expand, so the cost of
            # starting small is one `kubectl patch` later.
            storage: 10Gi
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: control-plane-postgres
                  key: password
            - name: POSTGRES_DB
              value: main
            # A subdirectory, not the mount point.
            #
            # A PersistentVolume mounted at the data directory arrives with a `lost+found` in it on
            # ext4, and `initdb` refuses a directory that is not empty. This was already correct on
            # the emptyDir version, where it was doing nothing.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "main"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
