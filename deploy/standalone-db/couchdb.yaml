# CouchDB, for tenants who need one.
#
# Added for `vrtmrz/obsidian-livesync`: an Obsidian plugin whose repository builds nothing a
# platform can serve, and whose deployable half is a CouchDB the plugin replicates against. What a
# customer needs is a database and a URI, which is what `backend_service` is for.
#
# ## Why the configuration below is not generic
#
# Obsidian is a browser-shaped runtime that is not a web page: it sends `Origin: app://obsidian.md`
# on desktop and `capacitor://localhost` on mobile. CouchDB rejects those unless they are named, and
# the rejection is a CORS failure inside the plugin — which the customer sees as "cannot connect"
# with no server-side trace at all. The origins here are the ones upstream's own
# `docker/config/livesync.ini` names, taken from there rather than guessed.
#
# The size limits are theirs too, and they are not decoration: a vault attachment is a single
# document, and CouchDB's 8 MB default refuses a photo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-couchdb-config
  namespace: sproutos-system
  labels:
    app.kubernetes.io/part-of: sproutos
data:
  # Mounted into `/opt/couchdb/etc/local.d/`, which CouchDB reads after its own defaults.
  #
  # `require_valid_user` is **not** set here, and that is upstream's warning rather than an
  # oversight: CouchDB has to finish its first-run cluster setup — creating `_users` and
  # `_replicator` — before authentication can be demanded, and a node that demands it first never
  # completes setup and never starts. It is applied afterwards, over the REST API, by the init Job.
  sproutos.ini: |
    [couchdb]
    max_document_size = 50000000

    [chttpd]
    bind_address = 0.0.0.0
    port = 5984
    max_http_request_size = 4294967296

    [httpd]
    ; **Required for the `[cors]` section below to do anything at all.**
    ;
    ; CouchDB reads `[cors]` only when this is on, and silently ignores it otherwise — no warning, no
    ; log line, just a preflight with no `Access-Control-Allow-Origin` on it. Upstream's own
    ; `docker/config/livesync.ini` omits it, which is worth knowing if you are comparing the two: their
    ; setup enables it elsewhere, and copying just the `[cors]` block gets you a server that looks
    ; configured and answers no origin.
    enable_cors = true
    WWW-Authenticate = Basic realm="couchdb"

    [cors]
    credentials = true
    origins = app://obsidian.md,capacitor://localhost,http://localhost

    [log]
    level = warning
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-couchdb
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: tenant-couchdb
    app.kubernetes.io/part-of: sproutos
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: tenant-couchdb
  ports:
    - name: couchdb
      port: 5984
      targetPort: 5984
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tenant-couchdb
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: tenant-couchdb
    app.kubernetes.io/part-of: sproutos
spec:
  serviceName: tenant-couchdb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-couchdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-couchdb
    spec:
      containers:
        - name: couchdb
          image: couchdb:3.5
          ports:
            - name: couchdb
              containerPort: 5984
          env:
            # The server administrator. The control plane authenticates as this to create each
            # tenant's database and user; no tenant ever sees it.
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: tenant-couchdb
                  key: username
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenant-couchdb
                  key: password
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
            # One file, by `subPath` — deliberately not the directory.
            #
            # CouchDB's entrypoint writes `docker.ini` into `local.d` to carry `COUCHDB_USER` and
            # `COUCHDB_PASSWORD` through to the server. Mounting a ConfigMap over the directory
            # makes the whole of it read-only and the container cannot start; mounting the same
            # file read-only under Docker produced an exit 1 with **no logs at all**, which is how
            # this was found. `subPath` leaves the directory the image's own and replaces one file
            # in it.
            #
            # The cost of `subPath` is that the file does not update when the ConfigMap does. That is
            # acceptable and almost desirable here: these settings change when the CouchDB version
            # or the client does, and a silent live change to CORS origins is not something anyone
            # wants to debug.
            - name: config
              mountPath: /opt/couchdb/etc/local.d/sproutos.ini
              subPath: sproutos.ini
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              # `/_up` answers without authentication and reports the node's own health, which is
              # what a readiness probe wants — `/` answers before the node can serve a database.
              path: /_up
              port: 5984
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: tenant-couchdb-config
  # A real volume, for the reason recorded in docs/findings/0010: the control-plane database ran on
  # `emptyDir` and lost everything on a reschedule. A tenant's notes are worse to lose than ours.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
