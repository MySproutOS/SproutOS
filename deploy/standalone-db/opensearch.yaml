# The shared tenant OpenSearch, for a cluster with no managed one.
#
# `search-proxy` is the only thing that connects here, and that is not a convention — it is the
# security model. Document- and field-level security are **not in the OpenSearch OSS tier**, so
# there is no way to make one cluster safe for several tenants from inside it. The proxy is the
# boundary: it authenticates the tenant, rewrites index names into that tenant's namespace, refuses
# cross-tenant reads and caps expensive query shapes.
#
# Which is why the cluster's own security plugin is off below. Leaving it on would add a second
# credential to manage in front of a boundary it cannot enforce, and would make the proxy's
# authentication look like defence in depth when it is the only defence there is.
#
# On AWS this is a self-managed EC2 fleet (TASK 33) and this file is not applied.
apiVersion: v1
kind: Service
metadata:
  name: tenant-opensearch
  namespace: sproutos-system
  labels:
    app.kubernetes.io/part-of: sproutos
spec:
  clusterIP: None
  selector:
    app: tenant-opensearch
  ports:
    - port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tenant-opensearch
  namespace: sproutos-system
  labels:
    app.kubernetes.io/part-of: sproutos
spec:
  serviceName: tenant-opensearch
  replicas: 1
  selector:
    matchLabels:
      app: tenant-opensearch
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
  template:
    metadata:
      labels:
        app: tenant-opensearch
    spec:
      # `sproutos-system` enforces the `restricted` Pod Security Standard, which fails at *pod*
      # creation rather than at apply — see this directory's README. The image runs as uid 1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Without this the PersistentVolume arrives owned by root and OpenSearch cannot create its
        # data directory, which presents as a crash loop one layer removed from the cause.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.19.1
          env:
            - name: discovery.type
              value: single-node
            # No security plugin. See the note at the top of this file: the proxy is the boundary.
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            # A small, fixed heap. Equal min and max because a JVM that grows its heap on a node
            # under memory pressure is a JVM that gets OOM-killed halfway through a merge.
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            # Bootstrap checks want memory locking or swap disabled. A container cannot mlock without
            # IPC_LOCK, which `restricted` forbids and which is not worth an exemption here.
            - name: bootstrap.memory_lock
              value: "false"
          ports:
            - containerPort: 9200
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=5s
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 1500Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
