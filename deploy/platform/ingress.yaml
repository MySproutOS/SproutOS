# How a request from the internet reaches the control plane.
#
# **This file did not exist until the first attempt to serve the platform on a real domain.**
# `apps.yaml` declares `website` and `internal-api` as ClusterIP Services, `tofu/` provisions no load
# balancer for them, and Kourier — which does have a public address — only reconciles Knative's own
# `Ingress` CRD, so it never sees a plain Deployment. Every manifest applied cleanly, every pod
# passed its probes, and there was no path from a browser to any of it. A conformance script that
# checks pods are Running cannot notice this; only pointing a domain at the cluster can.
#
# Two ingress paths on purpose, and they are not interchangeable:
#
#   * **This one** — an ordinary Ingress in front of long-lived Deployments. The marketing site and
#     the API must not scale to zero and must not depend on Knative's activator being healthy.
#   * **Kourier** — Knative's, for tenant applications, which *should* scale to zero.
#
# Putting the control plane behind Kourier would have saved a load balancer and coupled the sign-in
# page's availability to the component that also serves every customer's cold start.
#
# The controller itself is not vendored here. `ingress-nginx` is installed at cluster bootstrap
# (`bin/bootstrap-cluster.sh`) because its Service needs per-cloud annotations — an NLB on AWS, a
# plain LoadBalancer on GKE and AKS — and burying a cloud conditional in a checked-in manifest is
# how a manifest becomes untrue on two of the three clouds it claims to support.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: website
    app.kubernetes.io/part-of: sproutos
  annotations:
    # cert-manager watches for this and issues the certificate named in `tls.secretName` below.
    # Without it the `tls` block names a Secret nobody creates, nginx falls back to its self-signed
    # default certificate, and every browser refuses the site with a name-mismatch warning — which
    # reads as "the deploy is broken" rather than "no issuer is configured".
    cert-manager.io/cluster-issuer: letsencrypt
    # The SPAs ship large chunks and Next.js streams RSC payloads; the 60s default cuts a slow
    # first render. Not generous — just longer than a cold Node process answering its first request.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - CONTROL_PLANE_HOST
      # Issued by cert-manager from the ClusterIssuer the bootstrap script installs. Named even
      # when TLS is not yet wired: an Ingress without a `tls` block serves the app over plaintext
      # and nothing warns, and a session cookie marked `Secure` is simply never sent.
      secretName: website-tls
  rules:
    - host: CONTROL_PLANE_HOST
      http:
        paths:
          # Everything. `proxy.ts` inside the website does the real routing — SSR, the dashboard
          # SPA, the admin SPA and the shared routes are all decided there from the session cookie.
          # Splitting those prefixes across Ingress rules would put a second, dumber copy of that
          # routing table in a place that cannot see the cookie.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internal-api
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: internal-api
    app.kubernetes.io/part-of: sproutos
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Webhook bodies from GitHub and Stripe are verified over the raw bytes. nginx's 1 MiB default
    # rejects a large push payload with a 413 before the handler ever runs, and GitHub records that
    # as a failed delivery on a signature that was perfectly valid.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # SSE. Agent chat and log streaming are `text/event-stream`, and nginx buffers responses by
    # default — which turns a live stream into one silent connection that delivers everything at
    # the end, if it has not already hit the read timeout.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - API_HOST
      secretName: internal-api-tls
  rules:
    - host: API_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: internal-api
                port:
                  name: http
