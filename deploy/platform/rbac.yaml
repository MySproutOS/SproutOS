# Identities for the platform workloads.
#
# Every one of these has no Role and no ClusterRole, for the same reason the metering agent has none:
# they talk to Postgres, Valkey and OpenSearch, not to the Kubernetes API. A ServiceAccount with no
# bindings is a token that grants nothing beyond identity, and identity is all IRSA needs.
#
# The annotation is what IRSA keys on — not EKS Pod Identity, whose agent serves credentials on
# link-local 169.254.170.23, which a Kata pod's in-guest namespace cannot reach and which the tenant
# NetworkPolicy blocks anyway.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pg-proxy
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: pg-proxy
    app.kubernetes.io/part-of: sproutos
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${ACCOUNT}:role/sproutos-pg-proxy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: valkey-proxy
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: valkey-proxy
    app.kubernetes.io/part-of: sproutos
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${ACCOUNT}:role/sproutos-valkey-proxy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: search-proxy
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: search-proxy
    app.kubernetes.io/part-of: sproutos
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${ACCOUNT}:role/sproutos-search-proxy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: internal-api
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: internal-api
    app.kubernetes.io/part-of: sproutos
  annotations:
    # The API is the only platform workload that needs KMS: `@lib/envelope` unwraps data keys
    # through it to read OAuth tokens and tenant credentials.
    eks.amazonaws.com/role-arn: arn:aws:iam::${ACCOUNT}:role/sproutos-internal-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: website
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: website
    app.kubernetes.io/part-of: sproutos
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: sproutos
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${ACCOUNT}:role/sproutos-worker
---
# What the worker is allowed to do to the cluster.
#
# **There were no Roles in this file** — only ServiceAccounts. A ServiceAccount with no binding can
# do nothing at all, so every Job the worker exists to create would have been refused with a 403:
# the image builds, the Knative deploys, and now the workflow sandboxes. The pods started, the
# handlers ran, and the first thing any of them asked the API server for would have been denied.
#
# A ClusterRole rather than a Role per namespace, because tenant namespaces are created at runtime
# — one per organization — and a Role has to exist before the namespace it is in. The grant is
# therefore cluster-wide in scope and narrow in verbs, which is the trade this shape forces.
#
# What it deliberately does **not** include: secrets, configmaps, serviceaccounts, roles, or
# anything in `rbac.authorization.k8s.io`. A worker that could read Secrets cluster-wide would be a
# worker that could read every tenant's database password, and it never needs to — the credentials
# it uses arrive in its own environment.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sproutos-worker
  labels:
    app.kubernetes.io/part-of: sproutos
rules:
  # Namespaces, so provisioning a project can create the one its workloads live in. `create` and
  # `get`; never `delete` — tearing down a namespace deletes everything in it, and that decision
  # belongs to the reaper with a project id in front of it, not to a job handler.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch"]
  # Jobs: builds, and workflow sandboxes.
  #
  # `patch` as well as `create`, because this client uses server-side apply — a PATCH with
  # `application/apply-patch+yaml`, which the API server authorizes as `patch` and not as `create`.
  # Without it the grant looks complete and every apply is refused:
  # `cannot patch resource "jobs" in API group "batch"`.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # Reading what a Job did. `pods/log` is a subresource and has to be named separately — without it
  # a sandbox runs, exits, and reports an exit code with no output, which for a failed HTTP call is
  # the entire diagnosis missing.
  # Pods: read for Job output, and create/delete for dev sandboxes, which are pods rather than Jobs
  # because they outlive a single operation.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # `pods/exec` — the terminal, and every file read and write in a dev sandbox.
  #
  # The most powerful verb in this file by a distance: it runs a process inside a container. It is
  # granted because a dev sandbox is nothing without it, and it is bounded by what the sandbox pod
  # already is — no service-account token, no root, no capabilities, inside the tenant's namespace
  # under its NetworkPolicy. The grant does not make the platform able to exec into anything
  # interesting; it makes it able to exec into a box that was built to be uninteresting.
  #
  # Worth saying plainly rather than leaving in a verb list: if the sandbox pod spec ever loses
  # those properties, this line is what turns that into a cluster-wide problem.
  #
  # `get` as well as `create`. `kubectl exec` opens a SPDY stream with a POST and needs only
  # `create`; the WebSocket upgrade this client uses is a **GET**, and the API server authorizes it
  # as one — `cannot get resource "pods/exec"`. A grant of `create` alone looks right, matches every
  # example, and refuses every request this code makes.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Knative Services, which is how a deployment becomes a URL.
  - apiGroups: ["serving.knative.dev"]
    resources: ["services"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # The tenant NetworkPolicy, applied to a namespace as it is created. This is the grant that
  # matters most: a sandbox in a namespace with no policy is a sandbox with no isolation, so the
  # thing that creates the namespace must also be able to create the policy that protects it.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "patch"]
  # Queue workers, scaled between zero and one by `dispatchQueues` — TASK 20's dispatcher.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # Secrets: **write only**, and the omission is the point.
  #
  # A worker the platform starts has to authenticate to the tenant's queue, and the platform cannot
  # rebuild that URI — `service_credential` stores a hash. So the plaintext is captured at the one
  # moment it exists and written into a Secret in the tenant's namespace.
  #
  # `get` and `list` are deliberately absent. With them, a compromised control-plane pod could read
  # every credential in every tenant namespace; without them it can write one Secret and cannot read
  # any, including the ones it wrote. That is why `backend_service.worker_secret_at` exists: the
  # dispatcher has to know whether a Secret is there, and asking Kubernetes would require exactly
  # the grant being withheld.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sproutos-worker
  labels:
    app.kubernetes.io/part-of: sproutos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sproutos-worker
subjects:
  - kind: ServiceAccount
    name: worker
    namespace: sproutos-system
---
# The API gets the same grant.
#
# It creates a project's namespace and its NetworkPolicy inside the request that creates the
# project, so the customer sees the failure immediately rather than as a job that quietly did not
# run. Same ClusterRole rather than a second copy: two lists of verbs for one set of operations is
# two places for one of them to be forgotten.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sproutos-internal-api
  labels:
    app.kubernetes.io/part-of: sproutos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sproutos-worker
subjects:
  - kind: ServiceAccount
    name: internal-api
    namespace: sproutos-system
