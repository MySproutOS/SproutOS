# The website, the API, and the job worker.
#
# The worker is separate from the API on purpose and not for scale: a long job holding an event-loop
# turn inside the API delays every request behind it, and a worker that needs restarting should not
# take the API down with it. They read the same `background_job` table and nothing else coordinates
# them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-api
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: internal-api
    app.kubernetes.io/part-of: sproutos
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: internal-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: internal-api
    spec:
      serviceAccountName: internal-api
      containers:
        - name: api
          image: ${IMAGE_REGISTRY}/internal-api:${TAG}
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: API_PORT
              value: "3001"
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-database
                  key: url
            # The key `@lib/envelope` wraps data keys with. The application never sees plaintext
            # material — KMS does the unwrapping — so this is a key *id*, not a secret.
            - name: KMS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: kms-key-id
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: aws-region
            # AWS credentials, and only where there is no better way to get them.
            #
            # `@lib/envelope` talks to AWS KMS, and on EKS the right answer is IRSA: the pod's
            # projected token is exchanged for a role and no key material exists anywhere. That is
            # why both of these are `optional: true` — on EKS the Secret is absent, these resolve to
            # nothing, and the SDK's credential chain finds the projected token on its own.
            #
            # On GKE and AKS there is no IRSA, and the control plane's envelope encryption is
            # AWS-only. A cluster on another cloud therefore needs a real key pair to reach KMS, or
            # the OAuth callback fails at the last step of sign-in with `MissingKeyError` — after the
            # user has already authorized. Named here rather than left to whoever debugs it.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: secret-access-key
                  optional: true
            # The two public origins.
            #
            # `NEXT_PUBLIC_HOST_URL` is not decoration on a server process: `utils/env.ts` derives
            # the CORS allowlist from it, and the OAuth routes build their redirect URIs from it.
            # Unset, CORS rejects the browser's own website and the OAuth callback goes to
            # `http://localhost:3000` — in production, where it is not listening.
            - name: NEXT_PUBLIC_HOST_URL
              value: https://${CONTROL_PLANE_HOST}
            - name: PUBLIC_API_URL
              value: https://${API_HOST}
            # The session cookie is set by the website on CONTROL_PLANE_HOST and cleared here on
            # API_HOST. See `@utils/cookies`: derived from the host above it would be
            # `.CONTROL_PLANE_HOST`, which this host is not under, and every signed-in request would
            # arrive anonymous.
            - name: SESSION_COOKIE_DOMAIN
              value: ${SESSION_COOKIE_DOMAIN}
            - name: VALKEY_URL
              valueFrom:
                configMapKeyRef:
                  name: control-plane-valkey
                  key: url
            # The *tenant* Valkey's admin connection, used to provision per-tenant ACLs and to read
            # queue depth. Not the control plane's own — they are different clusters, and crossing
            # them would let a workflow's queue share a process with the session cache.
            # Secrets, not ConfigMaps, because an administrative connection URL carries the
            # password inside it. Both are assembled by an `ExternalSecret` template from the host
            # in the matching ConfigMap and the password in Secrets Manager, so the credential is
            # never in a manifest and never in a ConfigMap that anyone with `get configmaps` reads.
            # Where a customer's Postgres URI points, and where the platform connects itself. Two
            # values on purpose: the second is the proxy, the first is the cluster behind it.
            - name: SERVICE_POSTGRES_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: tenant-postgres
                  key: admin-url
            - name: SERVICE_POSTGRES_PUBLIC_HOST
              valueFrom:
                configMapKeyRef:
                  name: tenant-postgres
                  key: public-host
            - name: SERVICE_POSTGRES_PUBLIC_PORT
              valueFrom:
                configMapKeyRef:
                  name: tenant-postgres
                  key: public-port
            - name: SERVICE_VALKEY_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: tenant-valkey
                  key: admin-url
            - name: SEARCH_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: tenant-opensearch
                  key: admin-url
            - name: CLICKHOUSE_URL
              valueFrom:
                configMapKeyRef:
                  name: observability-clickhouse
                  key: url
            - name: CLICKHOUSE_USER
              valueFrom:
                configMapKeyRef:
                  name: observability-clickhouse
                  key: user
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: observability-clickhouse
                  key: password
            # Where `buildImage` pushes and `deployRevision` pulls. One value: a build that pushes
            # somewhere the cluster cannot pull from produces a Job that succeeds and a revision
            # that never starts.
            - name: BUILD_REGISTRY
              value: ${IMAGE_REGISTRY}
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: github-oauth
                  key: client-id
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-oauth
                  key: client-secret
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: webhook-secret
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe
                  key: secret-key
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: stripe
                  key: webhook-secret
            # Verifies the HMAC on every metering batch. The same key the DaemonSet signs with —
            # a mismatch rejects every event with a 401 and bills nothing, silently.
            - name: METERING_INGEST_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: metering-ingest
                  key: hmac-key
            # `HOME`, because the agent SDK and git both write under it — `~/.claude`,
            # `~/.gitconfig`, `~/.cache`. The image's `node` user has `/home/node`, which the
            # read-only root filesystem below makes unwritable, and neither tool degrades: git
            # fails the clone and the SDK exits the process.
            - name: HOME
              value: /scratch
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # /ready checks Postgres; /health does not. A liveness probe that checked the database
          # would restart every pod during a database blip and crash-loop the fleet through the
          # recovery. Readiness only pulls the pod out of the Service, which reverses itself.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            # Longer than the handler's own 2s database timeout, deliberately. The default is 1s,
            # which is shorter — so a slow-but-alive database produced a bare kubelet timeout and
            # the handler's own 503, which names the reason, was never seen. Whichever of the two
            # is shorter is the one that decides, and it should be the one that can explain itself.
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            # Writable space, because `readOnlyRootFilesystem: true` means there is none.
            #
            # `lib/typescript/agent/src/workspace.ts` clones a customer's repository into
            # `mkdtemp(tmpdir())` before an agent turn. With the root read-only and nothing mounted,
            # that `mkdtemp` fails and the process exits — the API pod died mid-request and nginx
            # answered 502, which reads as an application bug rather than a missing volume.
            #
            # `emptyDir`, not a PVC: a checkout is per-turn, shallow and single-branch, and nothing
            # here should survive a restart. `sizeLimit` so a large repository or a runaway agent
            # cannot fill the node's disk and evict everything else on it.
            - name: scratch
              mountPath: /scratch
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 4Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: internal-api
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: internal-api
    app.kubernetes.io/part-of: sproutos
spec:
  selector:
    app.kubernetes.io/name: internal-api
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: website
    app.kubernetes.io/part-of: sproutos
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: website
    spec:
      serviceAccountName: website
      containers:
        - name: website
          image: ${IMAGE_REGISTRY}/website:${TAG}
          ports:
            - name: http
              containerPort: 3000
          env:
            # Next's standalone server binds `process.env.HOSTNAME || "0.0.0.0"`, and the
            # container runtime sets HOSTNAME to the pod name — which /etc/hosts maps to the pod
            # IP. So it bound to the pod IP alone. The pod passed its readiness probe and served
            # Service traffic normally, because both target the pod IP; what broke was everything
            # that uses localhost inside the pod, `kubectl port-forward` included. Worse, a pod
            # whose own name failed to resolve would not bind at all.
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-database
                  key: url
            # Read at *runtime* by `proxy.ts` and the OAuth routes, which are server code — unlike
            # `NEXT_PUBLIC_API_URL`, which the browser bundle needs and which is therefore inlined
            # at build time and cannot be set here. That asymmetry is the trap: setting only this
            # one produces a server that knows its own origin and a client that calls the wrong API.
            - name: NEXT_PUBLIC_HOST_URL
              value: https://${CONTROL_PLANE_HOST}
            - name: SESSION_COOKIE_DOMAIN
              value: ${SESSION_COOKIE_DOMAIN}
            # The website is not a thin shell. Its OAuth callback runs `@lib/envelope` to encrypt the
            # GitHub access token before it touches the database, so it needs the same key the API
            # does. Without it the callback throws `MissingKeyError` *after* GitHub has redirected
            # back with a valid code — the user has authorized, and the last step of sign-in is the
            # one that fails.
            - name: KMS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: kms-key-id
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: aws-region
            # AWS credentials, and only where there is no better way to get them.
            #
            # `@lib/envelope` talks to AWS KMS, and on EKS the right answer is IRSA: the pod's
            # projected token is exchanged for a role and no key material exists anywhere. That is
            # why both of these are `optional: true` — on EKS the Secret is absent, these resolve to
            # nothing, and the SDK's credential chain finds the projected token on its own.
            #
            # On GKE and AKS there is no IRSA, and the control plane's envelope encryption is
            # AWS-only. A cluster on another cloud therefore needs a real key pair to reach KMS, or
            # the OAuth callback fails at the last step of sign-in with `MissingKeyError` — after the
            # user has already authorized. Named here rather than left to whoever debugs it.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: secret-access-key
                  optional: true
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: github-oauth
                  key: client-id
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-oauth
                  key: client-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            # Next.js writes its incremental cache to disk. `readOnlyRootFilesystem` with an
            # `emptyDir` over `.next/cache` would be the tidy answer; it is left false and flagged
            # rather than guessed at, because getting the mount path wrong fails at request time on
            # a cache miss, not at startup.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: website
    app.kubernetes.io/part-of: sproutos
spec:
  selector:
    app.kubernetes.io/name: website
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: sproutos
spec:
  # Two, not three. The job runner claims with `FOR UPDATE SKIP LOCKED`, so workers never contend —
  # adding replicas adds throughput and nothing else. Two is for availability during a rolling
  # deploy, not for capacity.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      serviceAccountName: worker
      # A worker holding a job lease should be allowed to finish it. The default 30 seconds would
      # kill mid-job and leave the lease to expire, which the runner handles — but re-running a job
      # that was nearly done is work paid for twice.
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: ${IMAGE_REGISTRY}/worker:${TAG}
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-database
                  key: url
            # The worker runs the build and deploy handlers, so it needs the registry, the envelope
            # key, and the queue the handlers publish to. It used to have none of them: every job
            # it claimed failed on a missing variable, and the runner's retry made that look like a
            # transient error rather than a configuration one.
            - name: KMS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: kms-key-id
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: aws-region
            # AWS credentials, and only where there is no better way to get them.
            #
            # `@lib/envelope` talks to AWS KMS, and on EKS the right answer is IRSA: the pod's
            # projected token is exchanged for a role and no key material exists anywhere. That is
            # why both of these are `optional: true` — on EKS the Secret is absent, these resolve to
            # nothing, and the SDK's credential chain finds the projected token on its own.
            #
            # On GKE and AKS there is no IRSA, and the control plane's envelope encryption is
            # AWS-only. A cluster on another cloud therefore needs a real key pair to reach KMS, or
            # the OAuth callback fails at the last step of sign-in with `MissingKeyError` — after the
            # user has already authorized. Named here rather than left to whoever debugs it.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: secret-access-key
                  optional: true
            - name: BUILD_REGISTRY
              value: ${IMAGE_REGISTRY}
            - name: VALKEY_URL
              valueFrom:
                configMapKeyRef:
                  name: control-plane-valkey
                  key: url
            # The reapers run here, not in the API: `reaper/src/search.ts` throws without
            # `SEARCH_ADMIN_URL`, and `jobs/src/handlers.ts` throws without the Valkey one. Both
            # throws are correct — a reaper that silently skips leaves a deleted tenant's data in
            # place — but a worker missing them fails every reap job on a configuration error the
            # job runner then retries as though it were transient.
            # Where a customer's Postgres URI points, and where the platform connects itself. Two
            # values on purpose: the second is the proxy, the first is the cluster behind it.
            - name: SERVICE_POSTGRES_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: tenant-postgres
                  key: admin-url
            - name: SERVICE_POSTGRES_PUBLIC_HOST
              valueFrom:
                configMapKeyRef:
                  name: tenant-postgres
                  key: public-host
            - name: SERVICE_POSTGRES_PUBLIC_PORT
              valueFrom:
                configMapKeyRef:
                  name: tenant-postgres
                  key: public-port
            - name: SERVICE_VALKEY_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: tenant-valkey
                  key: admin-url
            - name: SEARCH_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: tenant-opensearch
                  key: admin-url
            - name: NEXT_PUBLIC_HOST_URL
              value: https://${CONTROL_PLANE_HOST}
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: github-oauth
                  key: client-id
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-oauth
                  key: client-secret
            # Same reason as the API: fork upkeep (TASK 27) runs an agent turn, which clones the
            # repository first.
            - name: HOME
              value: /scratch
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: scratch
              mountPath: /scratch
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 4Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
