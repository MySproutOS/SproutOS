# Non-secret configuration.
#
# Deliberately ConfigMaps rather than Secrets: none of this is confidential, and putting a hostname
# in Secrets Manager would mean a KMS decrypt and an API call to learn something printed in the
# OpenTofu outputs. Treating everything as secret is how the things that genuinely are stop getting
# the attention they need.
#
# The values are placeholders. A deploy substitutes them from the OpenTofu outputs of the same name —
# `envelope_kms_key_arn`, `database_endpoint`, and so on.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: sproutos-system
  labels:
    app.kubernetes.io/part-of: sproutos
data:
  # `tofu output envelope_kms_key_arn`. A key id, not key material: `@lib/envelope` never holds
  # plaintext material — KMS does the unwrapping — which is why this belongs here and not in a
  # Secret.
  kms-key-id: KMS_KEY_ARN
  aws-region: REGION
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-postgres
  namespace: sproutos-system
  labels:
    app.kubernetes.io/part-of: sproutos
data:
  # The shared cluster tenants' databases live on. Not the control plane's — `pg-proxy` reads the
  # control-plane database for credentials and connects tenants here, and confusing the two would
  # route a customer into the table holding every customer's billing.
  host: TENANT_POSTGRES_HOST
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-valkey
  namespace: sproutos-system
  labels:
    app.kubernetes.io/part-of: sproutos
data:
  address: TENANT_VALKEY_HOST:6379
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-opensearch
  namespace: sproutos-system
  labels:
    app.kubernetes.io/part-of: sproutos
data:
  url: https://TENANT_OPENSEARCH_HOST:9200
---
# The control plane's own Valkey. Not a tenant's.
#
# `jobs/src/handlers.ts` publishes to this one and `workflows.ts` reads tenant queue depth from the
# other, and the two have deliberately different names because putting a customer's job queue in the
# same instance as the platform's session cache means one tenant's backlog evicts everyone's
# sessions.
apiVersion: v1
kind: ConfigMap
metadata:
  name: control-plane-valkey
  namespace: sproutos-system
  labels:
    app.kubernetes.io/part-of: sproutos
data:
  # No credential in the URL: the control-plane instance is reachable only from inside the VPC and
  # authenticates by network position. The *tenant* instance is not, which is why its admin URL is
  # a Secret and this one is not.
  url: redis://control-plane-valkey.sproutos-system.svc.cluster.local:6379
---
# ClickHouse, for the observability service.
#
# The password is separate, in Secrets Manager — `observability/src/client.ts` reads
# `CLICKHOUSE_PASSWORD` on its own and omits authentication entirely when it is unset, so putting
# the password here would be the difference between an authenticated client and one that quietly
# is not.
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-clickhouse
  namespace: sproutos-system
  labels:
    app.kubernetes.io/part-of: sproutos
data:
  url: http://clickhouse.sproutos-system.svc.cluster.local:8123
  user: sproutos
