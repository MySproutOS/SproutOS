# The three data-plane proxies.
#
# Each is the security boundary for its backend: a tenant reaches Postgres, Valkey and OpenSearch
# only through these, which is what the tenant NetworkPolicy enforces from the other side. That
# makes them the most security-relevant Deployments in the platform and the reason they share a file
# — the three are one decision, not three.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-proxy
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: pg-proxy
    app.kubernetes.io/part-of: sproutos
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pg-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-proxy
    spec:
      serviceAccountName: pg-proxy
      containers:
        - name: proxy
          image: ACCOUNT.dkr.ecr.REGION.amazonaws.com/sproutos/pg-proxy:TAG
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PG_PROXY_LISTEN
              value: 0.0.0.0:5432
            # The control-plane database, which the proxy reads `service_credential` from to
            # authenticate tenants. Not the cluster it proxies to.
            - name: PG_PROXY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-database
                  key: url
            - name: PG_PROXY_BACKEND_HOST
              valueFrom:
                configMapKeyRef:
                  name: tenant-postgres
                  key: host
            - name: PG_PROXY_BACKEND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenant-postgres
                  key: password
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              # No CPU limit on purpose. This is on the per-query path for every tenant, and CFS
              # throttling on a latency-sensitive proxy turns a busy moment into a visible stall.
              # The request is what the scheduler packs on; memory is what must not run away.
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: postgres
            # Slower than readiness and more tolerant. A proxy under load that misses one readiness
            # check should leave the endpoints list; one that misses a liveness check gets killed,
            # dropping every session it was holding.
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: pg-proxy
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: pg-proxy
    app.kubernetes.io/part-of: sproutos
spec:
  selector:
    app.kubernetes.io/name: pg-proxy
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# `valkey-proxy` and `search-proxy` mirror `pg-proxy` exactly: same security context, same probe
# shape, same reasoning about limits. They are separate Deployments rather than one because they
# scale on different signals — queue traffic is bursty per job, search traffic is per request — and
# because a bad deploy of one should not take the other's tenants offline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-proxy
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: valkey-proxy
    app.kubernetes.io/part-of: sproutos
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey-proxy
    spec:
      serviceAccountName: valkey-proxy
      containers:
        - name: proxy
          image: ACCOUNT.dkr.ecr.REGION.amazonaws.com/sproutos/valkey-proxy:TAG
          ports:
            - name: resp
              containerPort: 6379
          env:
            - name: VALKEY_PROXY_LISTEN
              value: 0.0.0.0:6379
            - name: VALKEY_PROXY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-database
                  key: url
            - name: VALKEY_PROXY_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: tenant-valkey
                  key: address
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            tcpSocket:
              port: resp
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: resp
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-proxy
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: valkey-proxy
    app.kubernetes.io/part-of: sproutos
spec:
  selector:
    app.kubernetes.io/name: valkey-proxy
  ports:
    - name: resp
      port: 6379
      targetPort: resp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-proxy
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: search-proxy
    app.kubernetes.io/part-of: sproutos
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: search-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: search-proxy
    spec:
      serviceAccountName: search-proxy
      containers:
        - name: proxy
          image: ACCOUNT.dkr.ecr.REGION.amazonaws.com/sproutos/search-proxy:TAG
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: SEARCH_PROXY_LISTEN
              value: 0.0.0.0:9200
            - name: SEARCH_PROXY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-database
                  key: url
            - name: SEARCH_PROXY_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: tenant-opensearch
                  key: url
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              # Larger than the other two: this one buffers request and response bodies to rewrite
              # index names, so its working set follows the size of a tenant's bulk uploads.
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: search-proxy
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: search-proxy
    app.kubernetes.io/part-of: sproutos
spec:
  selector:
    app.kubernetes.io/name: search-proxy
  ports:
    - name: http
      port: 9200
      targetPort: http
