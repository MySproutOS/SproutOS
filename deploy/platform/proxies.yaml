# The three data-plane proxies.
#
# Each is the security boundary for its backend: a tenant reaches Postgres, Valkey and OpenSearch
# only through these, which is what the tenant NetworkPolicy enforces from the other side. That
# makes them the most security-relevant Deployments in the platform and the reason they share a file
# — the three are one decision, not three.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-proxy
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: pg-proxy
    app.kubernetes.io/part-of: sproutos
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pg-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-proxy
    spec:
      serviceAccountName: pg-proxy
      containers:
        - name: proxy
          image: ACCOUNT.dkr.ecr.REGION.amazonaws.com/sproutos/pg-proxy:TAG
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PG_PROXY_LISTEN
              value: 0.0.0.0:5432
            # The control-plane database, which the proxy reads `service_credential` from to
            # authenticate tenants. Not the cluster it proxies to.
            - name: PG_PROXY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-database
                  key: url
            - name: PG_PROXY_BACKEND_HOST
              valueFrom:
                configMapKeyRef:
                  name: tenant-postgres
                  key: host
            - name: PG_PROXY_BACKEND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenant-postgres
                  key: password
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              # No CPU limit on purpose. This is on the per-query path for every tenant, and CFS
              # throttling on a latency-sensitive proxy turns a busy moment into a visible stall.
              # The request is what the scheduler packs on; memory is what must not run away.
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: postgres
            # Slower than readiness and more tolerant. A proxy under load that misses one readiness
            # check should leave the endpoints list; one that misses a liveness check gets killed,
            # dropping every session it was holding.
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: pg-proxy
  namespace: sproutos-system
  labels:
    app.kubernetes.io/name: pg-proxy
    app.kubernetes.io/part-of: sproutos
spec:
  selector:
    app.kubernetes.io/name: pg-proxy
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
