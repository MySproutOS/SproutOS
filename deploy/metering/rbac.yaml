# The agent's identity, and deliberately almost nothing attached to it.
#
# It reads cgroups from the host filesystem and pod ownership from the kubelet's socket, so it needs
# no Kubernetes API permissions at all — no `list pods`, no watch, nothing. That is the point of
# reading the socket rather than the API server: the agent runs on every node, and a credential that
# can list pods cluster-wide, replicated to every node including tenant metal, is a credential worth
# stealing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metering-agent
  namespace: sproutos-metering
  labels:
    app.kubernetes.io/name: metering-agent
    app.kubernetes.io/part-of: sproutos
# Deliberately no Role, no ClusterRole, no bindings. If a future version needs the API, the diff
# that adds them is the diff worth reviewing carefully.
# The `sproutos-system` Namespace this lives in is declared in `deploy/00-namespaces.yaml`,
# which renders first. It used to be here, after the ServiceAccount above and after the DaemonSet
# in `daemonset.yaml` — so a fresh apply failed before reaching it.
