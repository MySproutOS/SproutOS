# The highest priority a workload that is not the cluster's own may have.
#
# 1000000000 is not a round number chosen for looks: it is the ceiling Kubernetes enforces on any
# user-defined PriorityClass. A first attempt at 1999999000 — just under `system-cluster-critical` —
# was rejected outright with `maximum allowed value of a user defined priority is 1000000000`.
#
# That ceiling exists precisely so nothing outside `kube-system` can outrank the control plane, and
# it is the right constraint. What matters here is only that the agent outranks every tenant
# workload and every platform Deployment, which this does with a billion to spare.
#
# Declared at all rather than reusing `system-node-critical` because GKE refuses that class outside
# `kube-system` — see the note in the DaemonSet below.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: sproutos-node-critical
  labels:
    app.kubernetes.io/part-of: sproutos
value: 1000000000
globalDefault: false
description: "SproutOS node agents: evicted after tenant workloads, never before them."
---
# The metering agent, one pod per node.
#
# This is the manifest `services/metering-agent/README.md` names as absent, and it is what gives the
# agent the two things it cannot get on its own: the node's cgroup hierarchy, and the kubelet's view
# of which pod owns which cgroup.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: metering-agent
  namespace: sproutos-metering
  labels:
    app.kubernetes.io/name: metering-agent
    app.kubernetes.io/part-of: sproutos
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: metering-agent
  # Every node at once. A rolling update would leave part of the fleet unmetered for the duration,
  # and the agent re-baselines on restart anyway — so the cost of restarting them together is one
  # sampling interval, and the cost of doing it slowly is a gap in the billing record.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metering-agent
    spec:
      serviceAccountName: metering-agent
      # The agent reads the host's cgroup filesystem. It does not need the host's network, and
      # taking it would put it on the node's IP for no reason.
      hostNetwork: false
      hostPID: false
      # `sproutos-node-critical`, not `system-node-critical`.
      #
      # GKE enforces a ResourceQuota that restricts `system-node-critical` and
      # `system-cluster-critical` to `kube-system`, so this DaemonSet is refused outright there:
      # `insufficient quota to match these scopes`. Desired 2, current 0, and the only place that
      # says why is the DaemonSet's own event log.
      #
      # It has to keep a high priority for a real reason — the agent runs on tenant metal, and a
      # node under memory pressure that evicts the meter before the workload it is metering bills
      # nothing for the period that mattered most. Its own class, declared below, keeps that
      # property and is accepted everywhere.
      priorityClassName: sproutos-node-critical
      # Runs on tenant metal, which is tainted so nothing lands there by accident — and tenant metal
      # is precisely where the billable work happens.
      tolerations:
        - key: sproutos.dev/tenant
          operator: Equal
          value: "true"
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: agent
          image: IMAGE_REGISTRY/metering-agent:TAG
          imagePullPolicy: IfNotPresent
          env:
            # Required by the agent, which refuses to start without it: every event carries the node
            # as an attribute, and a fleet where half the events say `unknown` cannot answer which
            # node is overcharging.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: METERING_INGEST_URL
              value: http://internal-api.sproutos-system.svc.cluster.local:3001/v1/internal/metering/events
            - name: METERING_INGEST_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: metering-ingest
                  key: hmac-key
            - name: RUST_LOG
              value: metering_agent=info
          resources:
            # Small and equal: `requests == limits` puts this in the Guaranteed QoS class, so the
            # kubelet evicts tenant workloads before it evicts the thing that bills for them.
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            # Read-only, unprivileged, no capabilities. The agent reads two text files per cgroup
            # and talks to one HTTP endpoint; anything more would be a privilege it cannot justify
            # on a node running other people's code.
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            # The kubelet's pod-resources socket.
            #
            # **Mounted, and not currently read.** It was the intended source of pod ownership, and
            # it does not carry what is needed: it reports devices and containers, not pod *labels*,
            # and the attribution SproutOS bills on is a label. The agent lists this node's pods from
            # the API server instead — once per refresh interval, not once per sample.
            #
            # Kept mounted because it is the lower-privilege source and the one to move back to if a
            # future kubelet exposes labels through it. Said plainly rather than left as a comment
            # describing something the code stopped doing.
            - name: pod-resources
              mountPath: /var/lib/kubelet/pod-resources
              readOnly: true
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: pod-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
            type: Directory
