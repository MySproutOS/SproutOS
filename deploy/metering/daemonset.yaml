# The metering agent, one pod per node.
#
# This is the manifest `services/metering-agent/README.md` names as absent, and it is what gives the
# agent the two things it cannot get on its own: the node's cgroup hierarchy, and the kubelet's view
# of which pod owns which cgroup.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: metering-agent
  namespace: sproutos-metering
  labels:
    app.kubernetes.io/name: metering-agent
    app.kubernetes.io/part-of: sproutos
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: metering-agent
  # Every node at once. A rolling update would leave part of the fleet unmetered for the duration,
  # and the agent re-baselines on restart anyway — so the cost of restarting them together is one
  # sampling interval, and the cost of doing it slowly is a gap in the billing record.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metering-agent
    spec:
      serviceAccountName: metering-agent
      # The agent reads the host's cgroup filesystem. It does not need the host's network, and
      # taking it would put it on the node's IP for no reason.
      hostNetwork: false
      hostPID: false
      priorityClassName: system-node-critical
      # Runs on tenant metal, which is tainted so nothing lands there by accident — and tenant metal
      # is precisely where the billable work happens.
      tolerations:
        - key: sproutos.dev/tenant
          operator: Equal
          value: "true"
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: agent
          image: ACCOUNT.dkr.ecr.REGION.amazonaws.com/sproutos/metering-agent:TAG
          imagePullPolicy: IfNotPresent
          env:
            # Required by the agent, which refuses to start without it: every event carries the node
            # as an attribute, and a fleet where half the events say `unknown` cannot answer which
            # node is overcharging.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: METERING_INGEST_URL
              value: http://internal-api.sproutos-system.svc.cluster.local:3001/v1/internal/metering/events
            - name: METERING_INGEST_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: metering-ingest
                  key: hmac-key
            - name: RUST_LOG
              value: metering_agent=info
          resources:
            # Small and equal: `requests == limits` puts this in the Guaranteed QoS class, so the
            # kubelet evicts tenant workloads before it evicts the thing that bills for them.
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            # Read-only, unprivileged, no capabilities. The agent reads two text files per cgroup
            # and talks to one HTTP endpoint; anything more would be a privilege it cannot justify
            # on a node running other people's code.
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            # The kubelet's pod-resources socket: how the agent learns which pod owns which cgroup
            # without asking the API server. A per-node, per-second call to the control plane to ask
            # who owns each pod is the design that takes an API server down at scale.
            - name: pod-resources
              mountPath: /var/lib/kubelet/pod-resources
              readOnly: true
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: pod-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
            type: Directory
