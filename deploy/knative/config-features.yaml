# Knative feature flags SproutOS depends on.
#
# ## `kubernetes.podspec-runtimeclassname`
#
# Knative rejects `spec.template.spec.runtimeClassName` unless this is enabled — its admission
# webhook answers `must not set the field(s): spec.template.spec.runtimeClassName` and the Service
# is never created.
#
# That flag being off makes the entire tenant isolation design inoperable. ADR 0012 puts customer
# workloads on Kata Containers, with `kata-fc` for deploys and `kata-clh` for anything needing a
# live filesystem, and `deploy/tenant/runtime-classes.yaml` declares both. A Knative Service is how
# a tenant's code actually runs, so without this the only way to deploy one is to drop the
# `runtimeClassName` — which silently lands customer code on the shared host kernel, with the
# NetworkPolicies as the only remaining boundary.
#
# It is off by default and nothing in the repository turned it on, because nothing in the repository
# had ever created a Knative Service.
#
# Enabled rather than `allowed`: `allowed` lets a Service omit the field, and a tenant deployment
# that quietly runs without a hypervisor is exactly the outcome worth making impossible. The
# renderer always sets it (`lib/typescript/deploy/src/knative.ts`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-features
  namespace: knative-serving
  labels:
    app.kubernetes.io/part-of: sproutos
data:
  kubernetes.podspec-runtimeclassname: "enabled"
