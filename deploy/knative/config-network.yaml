# Knative's networking configuration, which SproutOS depends on being exactly this.
#
# Applied *after* Knative Serving is installed. It replaces the `data` block of the ConfigMap the
# install ships — safe, because Knative treats every absent key as its default and these three are
# the only ones the platform depends on.
#
# ## Why the domain template is not the default
#
# Knative's default is `{{.Name}}.{{.Namespace}}.{{.Domain}}`, which produced
# `myapp.tenant-abc123.sprout.run` — **two labels** in front of the apex.
#
# ADR 0018 is explicit that an ACM wildcard covers exactly one label, which is why preview hosts use
# the `pr-42--myapp` double-dash form rather than `pr-42.myapp`. The default template violates the
# same constraint for *every* tenant site, not just previews: `*.sprout.run` does not match
# `myapp.tenant-abc123.sprout.run`, so TLS termination fails for every production deployment on the
# platform.
#
# Nothing caught this because nobody had run Knative and read the URL it hands back. The Service
# reports `Ready: True` and publishes a `status.url` that simply cannot be certificated.
#
# ## Why the tag template is not the default
#
# Knative's default is `{{.Tag}}-{{.Name}}` — a single dash. ADR 0018 requires `pr-42--myapp`, and
# the double dash is load-bearing rather than cosmetic: a project slug may itself contain single
# dashes (`my-app`), so a single-dash separator makes `pr-42-my-app` ambiguous about where the tag
# ends. It is also Knative's own documented convention for exactly this reason.
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-network
  namespace: knative-serving
  labels:
    app.kubernetes.io/part-of: sproutos
data:
  ingress-class: kourier.ingress.networking.knative.dev
  # Single label in front of the apex, so one wildcard certificate covers every tenant host.
  domain-template: "{{.Name}}.{{.Domain}}"
  # `pr-42--myapp`, per ADR 0018.
  tag-template: "{{.Tag}}--{{.Name}}"
