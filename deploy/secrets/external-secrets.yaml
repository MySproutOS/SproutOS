# What creates the Secrets every Deployment here reads.
#
# Without these, `control-plane-database`, `tenant-postgres`, `tenant-valkey`, `tenant-opensearch`
# and `metering-ingest` do not exist, and every workload in `platform/` and `metering/` sits in
# `CreateContainerConfigError`. This is the manifest that makes the rest of the directory something
# other than decoration.
#
# The operator itself is not installed by anything here — see the README.
#
# `external-secrets.io/v1`, not `v1beta1`. These declared `v1beta1` until they were applied to a
# cluster with the operator actually installed, where every one of them was rejected outright:
# current External Secrets serves `v1` and marks `v1beta1` `served: false`. The whole secrets layer
# was dead on arrival, which means every workload here would have sat in
# `CreateContainerConfigError` indefinitely.
#
# `kubeconform` reported these as *skipped*, not failed — it carries no schema for a CRD it has
# never seen, so six of the thirty-eight resources in this directory were being counted as
# validated while nothing looked at them at all.
---
# How the operator authenticates to AWS.
#
# `jwt` with a service account, not static keys. A `SecretStore` holding an access key would be a
# long-lived AWS credential sitting in the cluster in order to fetch credentials, which is a loop
# worth refusing.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/part-of: sproutos
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${REGION}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# The control-plane database URL, assembled from the secret RDS manages.
#
# `manage_master_user_password` in `tofu/database.tf` means the password lives in Secrets Manager and
# never in OpenTofu state — so this reads what RDS wrote rather than what a plan produced. The
# template is what turns those fields into the single `url` every workload expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: control-plane-database
  namespace: sproutos-system
  labels:
    app.kubernetes.io/part-of: sproutos
spec:
  # Refreshed rather than fetched once. A rotated password with no refresh means every pod keeps
  # working until it restarts, and then none of them do — a failure that arrives hours after its
  # cause, all at once.
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: control-plane-database
    template:
      engineVersion: v2
      data:
        url: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/main?sslmode=require"
  data:
    - secretKey: username
      remoteRef:
        key: ${CONTROL_PLANE_DB_SECRET_ARN}
        property: username
    - secretKey: password
      remoteRef:
        key: ${CONTROL_PLANE_DB_SECRET_ARN}
        property: password
    - secretKey: host
      remoteRef:
        key: ${CONTROL_PLANE_DB_SECRET_ARN}
        property: host
    - secretKey: port
      remoteRef:
        key: ${CONTROL_PLANE_DB_SECRET_ARN}
        property: port
---
# The HMAC key the metering agent signs batches with, and the ingest route verifies.
#
# One key, read by both sides. A mismatch is a batch the API rejects as forged, which looks identical
# to the agent losing events — so this is deliberately the same secret rather than two that must be
# kept in step.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metering-ingest
  namespace: sproutos-metering
  labels:
    app.kubernetes.io/part-of: sproutos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: metering-ingest
  data:
    - secretKey: hmac-key
      remoteRef:
        key: sproutos/metering-ingest
        property: hmac-key
---
# The administrative credential each proxy connects to its shared backend with.
#
# Not a tenant credential: reaching an arbitrary tenant's database requires an administrative role,
# which is why `pg-proxy` drops to the tenant's role with `SET ROLE` immediately after connecting.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tenant-postgres
  namespace: sproutos-system
  labels:
    app.kubernetes.io/part-of: sproutos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: tenant-postgres
    # `admin-url` assembled here for the same reason as the Valkey and OpenSearch ones: it carries
    # the password, so it is a Secret rather than a ConfigMap. This is the *proxy's* route to the
    # cluster and the platform's — never a customer's.
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
        admin-url: "postgresql://postgres:{{ .password }}@${TENANT_POSTGRES_HOST}:5432/postgres?sslmode=require"
  data:
    - secretKey: password
      remoteRef:
        key: sproutos/tenant-postgres
        property: password
---
# The Valkey and OpenSearch administrative credentials, same shape and same reasoning as the
# Postgres one: reaching every tenant's keyspace or index namespace requires an administrative
# credential, and the proxy is what confines a session to one tenant's share of it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tenant-valkey
  namespace: sproutos-system
  labels:
    app.kubernetes.io/part-of: sproutos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: tenant-valkey
    # `admin-url` is assembled here rather than in a ConfigMap, because it contains the password.
    # `password` stays alongside it: `valkey-proxy` authenticates with the bare credential and the
    # control plane wants a URL, and templating one from the other beats storing the same secret
    # twice under two names that can fall out of step.
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
        admin-url: "redis://default:{{ .password }}@${TENANT_VALKEY_HOST}:6379"
  data:
    - secretKey: password
      remoteRef:
        key: sproutos/tenant-valkey
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tenant-opensearch
  namespace: sproutos-system
  labels:
    app.kubernetes.io/part-of: sproutos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: tenant-opensearch
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
        admin-url: "https://admin:{{ .password }}@${TENANT_OPENSEARCH_HOST}:9200"
  data:
    - secretKey: password
      remoteRef:
        key: sproutos/tenant-opensearch
        property: password
---
# The GitHub OAuth App.
#
# Both the website and the API hold it: the website runs the login redirect and the callback, the
# API exchanges and refreshes tokens. `lib/typescript/oauth/src/github.ts` calls `requireEnv` on
# both names, so a pod without them throws on the first sign-in attempt rather than at startup —
# which is the worst place for it, because the deploy looks healthy until a user tries to log in.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-oauth
  namespace: sproutos-system
  labels:
    app.kubernetes.io/part-of: sproutos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: github-oauth
  data:
    - secretKey: client-id
      remoteRef:
        key: sproutos/github-oauth
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: sproutos/github-oauth
        property: client-secret
---
# The GitHub App, which is a different identity from the OAuth App above.
#
# ADR 0005: `POST /user/repos` is `enabledForGitHubApps: false`, so the OAuth App is what creates a
# user's repository and the App is what does headless upkeep afterwards. The webhook secret belongs
# to the App — one App, one webhook URL, one secret verified over the raw request bytes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app
  namespace: sproutos-system
  labels:
    app.kubernetes.io/part-of: sproutos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: github-app
  data:
    - secretKey: app-id
      remoteRef:
        key: sproutos/github-app
        property: app-id
    - secretKey: private-key
      remoteRef:
        key: sproutos/github-app
        property: private-key
    - secretKey: webhook-secret
      remoteRef:
        key: sproutos/github-app
        property: webhook-secret
---
# Stripe.
#
# `STRIPE_WEBHOOK_SECRET` is read at request time by the webhook route, which verifies the
# signature over the raw body. An unset value there means every delivery is rejected as unsigned,
# so top-ups are charged and never credited — a silent money bug, which is why it is required
# rather than optional.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stripe
  namespace: sproutos-system
  labels:
    app.kubernetes.io/part-of: sproutos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: stripe
  data:
    - secretKey: secret-key
      remoteRef:
        key: sproutos/stripe
        property: secret-key
    - secretKey: webhook-secret
      remoteRef:
        key: sproutos/stripe
        property: webhook-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-clickhouse
  namespace: sproutos-system
  labels:
    app.kubernetes.io/part-of: sproutos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: observability-clickhouse
  data:
    - secretKey: password
      remoteRef:
        key: sproutos/observability-clickhouse
        property: password
