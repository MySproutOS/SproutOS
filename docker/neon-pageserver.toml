# The pageserver's configuration.
#
# A file rather than `-c` flags: those were accepted by older builds and are rejected outright by
# this one — `error: unexpected argument '-c' found`, which is the whole message. Every
# `docker-compose` example still circulating uses them.
#
# Copied into the workdir by the container's command rather than bind-mounted there. The pageserver
# writes its own state beside this file, and a read-only mount over the directory it wants to write
# to is a failure mode this repository has already paid for once, with CouchDB.
id = 1

listen_pg_addr = '0.0.0.0:6400'
listen_http_addr = '0.0.0.0:9898'

# How pageservers and safekeepers find each other. Neither is configured with the other's address.
broker_endpoint = 'http://neon-broker:50051'

# Where the Postgres binaries live, for WAL redo. The image ships v14 through v17 as
# `/usr/local/v17/bin/postgres`, so the distribution directory is their parent.
pg_distrib_dir = '/usr/local/'

# The storage controller this pageserver registers with, and the reason a single-node stack still
# needs one: without it the pageserver refuses to start, with
# `runtime-validation of config toml: `control_plane_api` must be set`.
#
# **Above `[remote_storage]`, and that is not cosmetic.** A bare key after a table header belongs to
# that table in TOML, so appending this at the end of the file made it `remote_storage.control_plane_api`
# — the pageserver reported the exact same "must be set" error with the key plainly present in the
# file, which is a confusing half-hour.
control_plane_api = 'http://neon-controller:1234/upcall/v1/'

# Separating compute from storage is the entire point, so the pageserver's durable home is object
# storage — LocalStack here, the same one everything else in this repository uses. A pageserver with
# only a local disk is Neon with the interesting part removed.
[remote_storage]
endpoint = 'http://localstack:4566'
bucket_name = 'sproutos-dev-pageserver'
bucket_region = 'us-east-1'
prefix_in_bucket = '/pageserver/'
