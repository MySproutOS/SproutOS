; CouchDB configuration for local development.
;
; The deployed equivalent is `deploy/standalone-db/couchdb.yaml`, and the two are the same settings
; for the same reasons — the CORS origins are Obsidian's own, from upstream's
; `docker/config/livesync.ini`, and the size limits are what a vault attachment needs.
;
; `require_valid_user` is deliberately absent here as well: CouchDB must finish its first-run
; cluster setup — creating `_users` and `_replicator` — before authentication can be demanded, and a
; node that demands it first never completes setup and never starts.
[couchdb]
max_document_size = 50000000

[chttpd]
bind_address = 0.0.0.0
port = 5984
max_http_request_size = 4294967296
require_valid_user = true

[httpd]
; **Required for the `[cors]` section below to do anything at all.**
;
; CouchDB reads `[cors]` only when this is on, and silently ignores it otherwise — no warning, no
; log line, just a preflight with no `Access-Control-Allow-Origin` on it. Upstream's own
; `docker/config/livesync.ini` omits it, which is worth knowing if you are comparing the two: their
; setup enables it elsewhere, and copying just the `[cors]` block gets you a server that looks
; configured and answers no origin.
enable_cors = true
WWW-Authenticate = Basic realm="couchdb"

[cors]
credentials = true
origins = app://obsidian.md,capacitor://localhost,http://localhost

[log]
level = warning

[admins]
admin = -pbkdf2:sha256-f527df1736887d342abf0072941f630c95d17f211e325ecf48e947d29711d545,52a2385f85fde2473fec7ea04e499e6d,600000

[cluster]
n = 1
