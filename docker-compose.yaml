services:
  postgres:
    container_name: sproutos_postgres
    image: postgres:18
    ports:
      - "25281:5432"
    volumes:
      - postgres:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=main

  valkey:
    image: valkey/valkey:9
    container_name: sproutos_valkey
    ports:
      - "41023:6379"
    volumes:
      - valkey:/data

  # Where logs, traces and metrics land (TASK 34).
  #
  # Not Postgres. A log store is append-mostly, queried by time range and by a handful of
  # low-cardinality columns, and retained for days rather than forever — which is the shape a
  # columnar store with a TTL is for. The same volume in Postgres would be a table nobody can
  # vacuum and an index that does not fit in memory.
  clickhouse:
    container_name: sproutos_clickhouse
    image: clickhouse/clickhouse-server:25.8
    ports:
      - "28123:8123"
      - "29000:9000"
    environment:
      - CLICKHOUSE_DB=observability
      - CLICKHOUSE_USER=sproutos
      - CLICKHOUSE_PASSWORD=sproutos
      # Without this the `sproutos` user cannot create tables, and the schema bootstrap fails with
      # a permission error that reads like a connection problem.
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      # ClickHouse wants a large fd limit and logs a warning that looks like a failure without it.
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse:/var/lib/clickhouse

  # Tenant search (TASK 33). One cluster, many tenants, split by index name.
  #
  # OpenSearch rather than Elasticsearch: Elastic's licence has not been open source since 7.11, and
  # "we manage the database ourselves in EC2 instances" is precisely the deployment that licence is
  # written to prevent. OpenSearch is the Apache-2.0 fork of the same codebase and speaks the same
  # API, so a customer's Elasticsearch client works unchanged.
  opensearch:
    container_name: sproutos_opensearch
    image: opensearchproject/opensearch:2.19.0
    ports:
      - "29200:9200"
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # A development heap. Production sizing is phase 9's problem; 512 MB is enough to hold a few
      # tenant indices and small enough to sit alongside Postgres, Valkey and ClickHouse on a laptop.
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      # The security plugin is off here and the proxy is the boundary regardless: document- and
      # field-level security are not in the open-source tier, which is *why* services/search-proxy
      # exists rather than being a convenience.
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch:/usr/share/opensearch/data

  localstack:
    container_name: sproutos_localstack
    image: localstack/localstack:2026.07.5
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4510-4559:4510-4559"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
      - SERVICES=kms,s3,secretsmanager,ssm,kinesis,ses,sqs,sns,iam,sts
      - DEBUG=${DEBUG:-0}
    volumes:
      - localstack:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

  # --- Self-hosted Neon (ADR 0025) ---------------------------------------------
  #
  # The open-source project, not the SaaS. Three backlog items were `[~]` for one reason: the
  # platform provisions a database and a role on an ordinary Postgres cluster, and calls it
  # `provider = 'sprout'`. Branching and sub-second cold starts are Neon's *storage layer*, and
  # nothing here was pretending otherwise.
  #
  # `storage_broker` is the rendezvous point: pageservers and safekeepers find each other through it
  # rather than being told about each other, which is why it starts first and why nothing else works
  # without it.
  neon-broker:
    container_name: sproutos_neon_broker
    image: neondatabase/neon:latest
    entrypoint: ["/usr/local/bin/storage_broker"]
    command: ["--listen-addr=0.0.0.0:50051"]
    ports:
      - "127.0.0.1:50051:50051"

  # The safekeepers hold the WAL under Paxos before the pageserver has digested it. One here; three
  # is the quorum in production, and the difference is durability, not behaviour.
  neon-safekeeper:
    container_name: sproutos_neon_safekeeper
    image: neondatabase/neon:latest
    depends_on:
      - neon-broker
    entrypoint: ["/usr/local/bin/safekeeper"]
    command:
      - "--id=1"
      - "--listen-pg=0.0.0.0:5454"
      - "--listen-http=0.0.0.0:7676"
      # What the safekeeper tells the broker to reach it on, as opposed to what it binds.
      #
      # Without these it advertises its *listen* address, so the pageserver reads `0.0.0.0:5454`
      # out of the broker and connects to itself. Nothing says so: the safekeeper is healthy, the
      # pageserver logs one "Connection refused" per retry, and the symptom appears three
      # components away as a compute hanging forever on `wait_lsn` for a page request — because the
      # WAL never reaches the pageserver, so the LSN it is waiting for never arrives.
      - "--advertise-pg=neon-safekeeper:5454"
      - "--broker-endpoint=http://neon-broker:50051"
      - "-D"
      - "/data"
    ports:
      - "127.0.0.1:25454:5454"
      - "127.0.0.1:27676:7676"
    volumes:
      - neon_safekeeper:/data

  # The pageserver turns WAL into pages and is what makes a branch cheap: a timeline is
  # copy-on-write over its parent's pages, so branching a 100 GB database copies nothing.
  #
  # Its remote storage is LocalStack's S3 — the same LocalStack everything else here uses. That is
  # not a shortcut: separating compute from storage is the whole design, and a pageserver with only
  # local disk is the part of Neon that does not matter.
  # The storage controller: which pageserver holds which tenant, and the shard splits when one grows.
  #
  # Not optional, and not in any of the `docker-compose` examples still circulating — the pageserver
  # refuses to start without it: `runtime-validation of config toml: \`control_plane_api\` must be
  # set`. It is the piece that turned Neon from "a pageserver" into a fleet, and self-hosting it
  # means running the fleet manager even with one of everything.
  #
  # `--dev` disables JWT auth between the storage components. Correct here and nowhere else: these
  # talk to each other on a private network, and in production each pair holds a token.
  neon-controller:
    container_name: sproutos_neon_controller
    image: neondatabase/neon:latest
    depends_on:
      - neon-broker
    entrypoint: ["/usr/local/bin/storage_controller"]
    command:
      - "--listen=0.0.0.0:1234"
      - "--dev"
      # Its own database on the development Postgres. In production this is a separate cluster: it
      # is the map of where every tenant's data lives, and losing it is worse than losing a
      # pageserver.
      - "--database-url=postgresql://postgres:postgres@host.docker.internal:25281/storage_controller"
      # Not optional. Without it the controller panics on the first attach — after the tenant has
      # been created — and the reconcile never completes. `apps/internal-api/src/v1/neon.ts` is what
      # answers, and the controller appends `/notify-attach` to this.
      - "--control-plane-url=http://host.docker.internal:3001/v1/internal/neon"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:21234:1234"

  neon-pageserver:
    container_name: sproutos_neon_pageserver
    image: neondatabase/neon:latest
    depends_on:
      - neon-broker
      - neon-controller
    # `sh -c`, so the config lands in the workdir the pageserver writes to rather than being
    # bind-mounted over it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mkdir -p /data/.neon && cp /etc/neon/pageserver.toml /data/.neon/pageserver.toml && exec /usr/local/bin/pageserver -D /data/.neon"
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    ports:
      - "127.0.0.1:26400:6400"
      - "127.0.0.1:29898:9898"
    volumes:
      - neon_pageserver:/data
      - ./docker/neon-pageserver.toml:/etc/neon/pageserver.toml:ro

volumes:
  postgres:
    driver: local
  valkey:
    driver: local
  clickhouse:
    driver: local
  opensearch:
    driver: local
  localstack:
    driver: local
  neon_pageserver:
    driver: local
  neon_safekeeper:
    driver: local
