services:
  postgres:
    container_name: sproutos_postgres
    image: postgres:18
    ports:
      - "25281:5432"
    volumes:
      - postgres:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=main

  valkey:
    image: valkey/valkey:9
    container_name: sproutos_valkey
    ports:
      - "41023:6379"
    volumes:
      - valkey:/data

  # Where logs, traces and metrics land (TASK 34).
  #
  # Not Postgres. A log store is append-mostly, queried by time range and by a handful of
  # low-cardinality columns, and retained for days rather than forever — which is the shape a
  # columnar store with a TTL is for. The same volume in Postgres would be a table nobody can
  # vacuum and an index that does not fit in memory.
  # The log buffer, matching what OVH runs — same image, same KRaft combined mode, smaller heap.
  #
  # Here rather than only on the OVH box, because a transport that can only be exercised on the one
  # machine somebody seeded by hand is a transport nobody tests. The runtime-log *table* had exactly
  # that problem last week.
  kafka:
    container_name: sproutos_kafka
    image: apache/kafka:4.3.1
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:29092
      # Advertised as `kafka:9092` for containers on this network and `localhost:29092` for the
      # host. One listener cannot be both: a broker that advertises `localhost` sends a container
      # to itself, and one that advertises `kafka` sends the host to a name it cannot resolve.
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,HOST://localhost:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_LOG_RETENTION_HOURS=24
    ports:
      - "29092:29092"

  clickhouse:
    container_name: sproutos_clickhouse
    image: clickhouse/clickhouse-server:25.8
    ports:
      - "28123:8123"
      - "29000:9000"
    environment:
      - CLICKHOUSE_DB=observability
      - CLICKHOUSE_USER=sproutos
      - CLICKHOUSE_PASSWORD=sproutos
      # Without this the `sproutos` user cannot create tables, and the schema bootstrap fails with
      # a permission error that reads like a connection problem.
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      # ClickHouse wants a large fd limit and logs a warning that looks like a failure without it.
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse:/var/lib/clickhouse

  # Tenant search (TASK 33). One cluster, many tenants, split by index name.
  #
  # OpenSearch rather than Elasticsearch: Elastic's licence has not been open source since 7.11, and
  # "we manage the database ourselves in EC2 instances" is precisely the deployment that licence is
  # written to prevent. OpenSearch is the Apache-2.0 fork of the same codebase and speaks the same
  # API, so a customer's Elasticsearch client works unchanged.
  opensearch:
    container_name: sproutos_opensearch
    image: opensearchproject/opensearch:2.19.0
    ports:
      - "29200:9200"
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # A development heap. Production sizing is phase 9's problem; 512 MB is enough to hold a few
      # tenant indices and small enough to sit alongside Postgres, Valkey and ClickHouse on a laptop.
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      # Development uses the image's test CA, then `bin/bootstrap-opensearch-security.sh` replaces
      # the demo authorization config. Production never uses these certificates.
      - DISABLE_SECURITY_PLUGIN=false
      - DISABLE_INSTALL_DEMO_CONFIG=false
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${SEARCH_ADMIN_PASSWORD:-L0cal!Windmill-Quartz-83}
      - plugins.security.ssl.http.enabled=false
      - plugins.security.restapi.roles_enabled=all_access
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -u admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD} http://localhost:9200/_cluster/health >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  localstack:
    container_name: sproutos_localstack
    image: localstack/localstack:2026.07.5
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4510-4559:4510-4559"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
      - SERVICES=kms,s3,secretsmanager,ssm,kinesis,sqs,sns,iam,sts
      - DEBUG=${DEBUG:-0}
    volumes:
      - localstack:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

  # Local transactional-email sink. SMTP is on 1025 and the browser inbox is on 8025.
  mailhog:
    container_name: sproutos_mailhog
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres:
    driver: local
  valkey:
    driver: local
  clickhouse:
    driver: local
  opensearch:
    driver: local
  localstack:
    driver: local
