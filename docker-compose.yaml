services:
  postgres:
    container_name: sproutos_postgres
    image: postgres:18
    ports:
      - "25281:5432"
    volumes:
      - postgres:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=main

  valkey:
    image: valkey/valkey:9
    container_name: sproutos_valkey
    ports:
      - "41023:6379"
    volumes:
      - valkey:/data

  # Where logs, traces and metrics land (TASK 34).
  #
  # Not Postgres. A log store is append-mostly, queried by time range and by a handful of
  # low-cardinality columns, and retained for days rather than forever — which is the shape a
  # columnar store with a TTL is for. The same volume in Postgres would be a table nobody can
  # vacuum and an index that does not fit in memory.
  clickhouse:
    container_name: sproutos_clickhouse
    image: clickhouse/clickhouse-server:25.8
    ports:
      - "28123:8123"
      - "29000:9000"
    environment:
      - CLICKHOUSE_DB=observability
      - CLICKHOUSE_USER=sproutos
      - CLICKHOUSE_PASSWORD=sproutos
      # Without this the `sproutos` user cannot create tables, and the schema bootstrap fails with
      # a permission error that reads like a connection problem.
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      # ClickHouse wants a large fd limit and logs a warning that looks like a failure without it.
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse:/var/lib/clickhouse

  # Tenant search (TASK 33). One cluster, many tenants, split by index name.
  #
  # OpenSearch rather than Elasticsearch: Elastic's licence has not been open source since 7.11, and
  # "we manage the database ourselves in EC2 instances" is precisely the deployment that licence is
  # written to prevent. OpenSearch is the Apache-2.0 fork of the same codebase and speaks the same
  # API, so a customer's Elasticsearch client works unchanged.
  opensearch:
    container_name: sproutos_opensearch
    image: opensearchproject/opensearch:2.19.0
    ports:
      - "29200:9200"
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # A development heap. Production sizing is phase 9's problem; 512 MB is enough to hold a few
      # tenant indices and small enough to sit alongside Postgres, Valkey and ClickHouse on a laptop.
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      # The security plugin is off here and the proxy is the boundary regardless: document- and
      # field-level security are not in the open-source tier, which is *why* services/search-proxy
      # exists rather than being a convenience.
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch:/usr/share/opensearch/data

  # CouchDB, for the `couchdb` backend service kind.
  #
  # Configured the way `obsidian-livesync` needs — the CORS origins are Obsidian's own
  # (`app://obsidian.md` on desktop, `capacitor://localhost` on mobile), taken from upstream's
  # `docker/config/livesync.ini` rather than guessed. Without them the plugin fails inside its own
  # fetch and the server logs nothing at all.
  #
  # `25984`, not 5984: the same reason every other port here is unusual. A CouchDB a developer is
  # already running should not be silently provisioned into.
  couchdb:
    container_name: sproutos_couchdb
    image: couchdb:3.5
    ports:
      - "127.0.0.1:25984:5984"
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=couchdb
    volumes:
      - couchdb:/opt/couchdb/data
      # **Not `:ro`.** CouchDB's entrypoint writes `docker.ini` into this same directory to carry
      # `COUCHDB_USER`/`COUCHDB_PASSWORD` through, and a read-only bind here makes the container
      # exit 1 with no logs whatsoever — not a permission error, not a config error, nothing. It
      # cost half an hour to find, and the only signal was that removing the mount fixed it.
      - ./docker/couchdb-local.ini:/opt/couchdb/etc/local.d/sproutos.ini

  localstack:
    container_name: sproutos_localstack
    image: localstack/localstack:2026.07.5
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4510-4559:4510-4559"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
      - SERVICES=kms,s3,secretsmanager,ssm,kinesis,ses,sqs,sns,iam,sts
      - DEBUG=${DEBUG:-0}
    volumes:
      - localstack:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  couchdb:
    driver: local
  postgres:
    driver: local
  valkey:
    driver: local
  clickhouse:
    driver: local
  opensearch:
    driver: local
  localstack:
    driver: local
