# The cluster the `cluster` CI job applies `deploy/` to.
#
# `disableDefaultCNI` is the whole point of this file. kind ships `kindnet`, which accepts
# NetworkPolicy objects and does not enforce them — so a tenant isolation test run on a default kind
# cluster passes no matter what the policy says, including when it names a pod that exists in no
# cluster anywhere. Calico is installed in its place by the job.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  # Calico's default IPv4 pool. Left at the default so the manifest can be applied unmodified.
  podSubnet: "192.168.0.0/16"
