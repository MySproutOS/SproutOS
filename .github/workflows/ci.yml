name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  format:
    name: (oxfmt) Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting with Oxfmt
        run: pnpm run format --check

  build:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: main
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # TASK 35's job inspection reads and writes real BullMQ jobs. Without this the tests skip,
      # and a skipped test looks exactly like a passing one in the summary.
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 41023:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # TASK 34's log store. Same reasoning: the tests that check one project cannot read another's
      # logs are worth nothing if they quietly do not run.
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        ports:
          - 28123:8123
        env:
          CLICKHOUSE_DB: observability
          CLICKHOUSE_USER: sproutos
          CLICKHOUSE_PASSWORD: sproutos
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/main
      SERVICE_VALKEY_ADMIN_URL: redis://127.0.0.1:41023
      CLICKHOUSE_URL: http://127.0.0.1:28123
      CLICKHOUSE_DATABASE: observability
      CLICKHOUSE_USER: sproutos
      CLICKHOUSE_PASSWORD: sproutos
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache for Turbo
        uses: rharkor/caching-for-turbo@v2.4.2
        with:
          max-age: 1w
          max-files: 50
          max-size: 3gb

      - name: Run migrations
        run: pnpm --filter=dbmigrator run migrate:latest

      # The price book, regions, store categories, and system roles are reference
      # data the API cannot function without — a migrated-but-unseeded database is
      # a state no deployment ever has, and the route tests read against it.
      - name: Seed reference data
        run: pnpm --filter=dbmigrator run seed:run

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

  rust:
    name: (cargo) Format, Clippy, and Test
    runs-on: ubuntu-latest
    # The proxies' integration tests provision real tenants and drive real clients through to a real
    # backend. They skip when these are absent rather than failing, which is exactly why they have to
    # be here: a silently skipped isolation test is worse than no isolation test.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: main
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 41023:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # TASK 33's shared cluster. The tests that check one tenant cannot read another's index are
      # the whole point of the proxy, and they skip without this.
      opensearch:
        image: opensearchproject/opensearch:2.19.0
        ports:
          - 29200:9200
        env:
          discovery.type: single-node
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
          DISABLE_SECURITY_PLUGIN: true
          DISABLE_INSTALL_DEMO_CONFIG: true
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/main
      VALKEY_PROXY_BACKEND: 127.0.0.1:41023
      SEARCH_PROXY_UPSTREAM: http://127.0.0.1:29200
    steps:
      - uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-musl
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The schema the proxies authenticate against is defined by the migrations, so the Rust job
      # needs them applied. Node is here for that and nothing else.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run migrations
        run: pnpm --filter=dbmigrator run migrate:latest
      - name: Seed reference data
        run: pnpm --filter=dbmigrator run seed:run

      - name: Test
        run: cargo test --workspace
