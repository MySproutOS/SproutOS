name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  format:
    name: (oxfmt) Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting with Oxfmt
        run: pnpm run format --check

  build:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: main
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # TASK 35's job inspection reads and writes real BullMQ jobs. Without this the tests skip,
      # and a skipped test looks exactly like a passing one in the summary.
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 41023:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # TASK 34's log store. Same reasoning: the tests that check one project cannot read another's
      # logs are worth nothing if they quietly do not run.
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        ports:
          - 28123:8123
        env:
          CLICKHOUSE_DB: observability
          CLICKHOUSE_USER: sproutos
          CLICKHOUSE_PASSWORD: sproutos
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The reaper deletes a destroyed tenant's indices, and everything it claims is a claim about
      # how OpenSearch answers. Without a cluster here those tests skip, and a skipped deletion test
      # reads as a pass while the data it should have removed is still on disk.
      opensearch:
        image: opensearchproject/opensearch:2.19.0
        ports:
          - 29200:9200
        env:
          discovery.type: single-node
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
          DISABLE_SECURITY_PLUGIN: true
          DISABLE_INSTALL_DEMO_CONFIG: true
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/main
      SERVICE_VALKEY_ADMIN_URL: redis://127.0.0.1:41023
      SEARCH_ADMIN_URL: http://127.0.0.1:29200
      CLICKHOUSE_URL: http://127.0.0.1:28123
      CLICKHOUSE_DATABASE: observability
      CLICKHOUSE_USER: sproutos
      CLICKHOUSE_PASSWORD: sproutos
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache for Turbo
        uses: rharkor/caching-for-turbo@v2.4.2
        with:
          max-age: 1w
          max-files: 50
          max-size: 3gb

      - name: Run migrations
        run: pnpm --filter=dbmigrator run migrate:latest

      # The price book, regions, store categories, and system roles are reference
      # data the API cannot function without — a migrated-but-unseeded database is
      # a state no deployment ever has, and the route tests read against it.
      - name: Seed reference data
        run: pnpm --filter=dbmigrator run seed:run

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      # Separate from `build`, because `vite build` does not typecheck: it strips types with
      # esbuild and never runs `tsc`, so a green build said nothing about the two SPAs. A `process`
      # reference in `@lib/api-client` had been a type error in both of them for as long as the
      # file existed, and every "build clean" reported here was blind to it.
      - name: Check types
        run: pnpm run check-types

      - name: Test
        run: pnpm exec vitest --run --config .config/vitest.config.mts --reporter=default --reporter=json --outputFile.json=vitest-report.json

      # A skipped test reads exactly like a passing one in the summary. Several suites gate on a
      # capability this environment lacks — LocalStack for KMS, a GitHub App, an Anthropic key — so
      # CI has never executed the envelope-encryption suite that protects OAuth tokens and database
      # credentials, and nothing said so. The known skips are now written down with what each is
      # waiting for, and the count is a ceiling: anything newly silent fails the build.
      - name: No new silent skips
        run: node bin/check-skipped-tests.mjs vitest-report.json

  rust:
    name: (cargo) Format, Clippy, and Test
    runs-on: ubuntu-latest
    # The proxies' integration tests provision real tenants and drive real clients through to a real
    # backend. They skip when these are absent rather than failing, which is exactly why they have to
    # be here: a silently skipped isolation test is worse than no isolation test.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: main
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 41023:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # TASK 33's shared cluster. The tests that check one tenant cannot read another's index are
      # the whole point of the proxy, and they skip without this.
      opensearch:
        image: opensearchproject/opensearch:2.19.0
        ports:
          - 29200:9200
        env:
          discovery.type: single-node
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
          DISABLE_SECURITY_PLUGIN: true
          DISABLE_INSTALL_DEMO_CONFIG: true
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/main
      VALKEY_PROXY_BACKEND: 127.0.0.1:41023
      SEARCH_PROXY_UPSTREAM: http://127.0.0.1:29200
    steps:
      - uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-musl
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # The version is written down in three places — this workflow, rust-toolchain.toml, and every
      # Rust Dockerfile — and nothing connected them. All four images sat on rust:1.85 while the repo
      # moved to 1.93; two of them built anyway, because their dependency trees do not reach a crate
      # that demands newer, which is exactly why nobody noticed.
      - name: Check the Rust toolchain pins agree
        run: node bin/check-rust-toolchain.mjs
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The schema the proxies authenticate against is defined by the migrations, so the Rust job
      # needs them applied. Node is here for that and nothing else.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run migrations
        run: pnpm --filter=dbmigrator run migrate:latest
      - name: Seed reference data
        run: pnpm --filter=dbmigrator run seed:run

      - name: Test
        run: cargo test --workspace

  tofu:
    name: (tofu) Format and Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.10.6"

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.59.1

      - name: Format
        run: tofu fmt -check -recursive
        working-directory: tofu

      # `-backend=false`: the state backend needs credentials and this job has none. Everything
      # below is a check on the configuration itself, which is the only kind available without an
      # account.
      - name: Init
        run: tofu init -backend=false
        working-directory: tofu

      - name: Validate
        run: tofu validate
        working-directory: tofu

      # Worth being clear about the ceiling: this catches unused declarations and undocumented
      # variables. It does *not* catch an invalid instance type or a nonexistent database engine —
      # I checked, and both pass. See tofu/README.md.
      - name: Lint
        run: |
          tflint --init
          tflint
        working-directory: tofu

  manifests:
    name: (kubeconform) Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `kubeconform`, not `kubectl --dry-run=client`. kubectl downloads the OpenAPI schema from a
      # live cluster, so without one it validates nothing — it fails with `connection refused`,
      # which is not the same as passing. kubeconform carries the schemas.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      # Prove the validator works before trusting what it says.
      #
      # `.github/fixtures/known-bad-manifest.yaml` contains `readOnlyRootFilesytem` — a typo the API
      # server would ignore, applying cleanly and leaving the container with a writable root. If
      # kubeconform accepts it, the flags are wrong or the schemas did not load, and every green
      # result from the next step is worthless.
      - name: The validator rejects a manifest it should reject
        run: |
          if kubeconform -strict -kubernetes-version 1.34.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            .github/fixtures/known-bad-manifest.yaml; then
            echo "::error::kubeconform accepted a manifest with unknown fields. The check is not checking."
            exit 1
          fi
          echo "kubeconform correctly rejected the known-bad fixture"

      # `-strict` rejects unknown fields, which is the check that matters: a typo in a field name is
      # silently ignored by the API server, so `readOnlyRootFilesytem` would apply cleanly and do
      # nothing at all.
      # `-schema-location default` keeps the built-in Kubernetes schemas; the second location is a
      # community catalogue of CRD schemas, which is what makes the External Secrets manifests
      # validated rather than merely well-formed YAML. `-ignore-missing-schemas` is deliberately NOT
      # set: a CRD whose schema cannot be found should fail, not pass silently, or this whole job
      # quietly stops covering the files most likely to be wrong.
      - name: Validate
        run: |
          kubeconform -strict -summary -kubernetes-version 1.34.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            deploy/

      # The renderer's own tests run in the `build` job; this asserts the two halves agree — that
      # every placeholder in a checked-in manifest is one the renderer knows how to fill. A
      # placeholder added to a manifest and not to `PLACEHOLDERS` renders to itself, passes every
      # schema check, and is applied to a cluster as a literal string.
      - name: Every placeholder is one the renderer knows
        run: |
          cat > /tmp/outputs.json <<'JSON'
          {
            "aws_account_id": { "value": "123456789012" },
            "aws_region": { "value": "us-east-1" },
            "envelope_kms_key_arn": { "value": "arn:aws:kms:us-east-1:123456789012:key/x" },
            "database_credentials_secret_arn": { "value": "arn:aws:secretsmanager:us-east-1:123456789012:secret:x" }
          }
          JSON
          TAG=ci TENANT_NAMESPACE=ci TENANT_POSTGRES_HOST=a TENANT_VALKEY_HOST=b TENANT_OPENSEARCH_HOST=c \
            pnpm exec tsx bin/render-manifests.mjs /tmp/outputs.json > /tmp/rendered.yaml
          echo "rendered $(grep -c '^---' /tmp/rendered.yaml) document separators"

  cluster:
    name: (kind) Apply to a real API server
    runs-on: ubuntu-latest
    # Everything above validates these manifests without a cluster, and everything above missed the
    # same class of bug. `kubeconform -strict` checks each document against a schema; it has no idea
    # whether the namespace exists, whether a Pod Security Standard will reject the pod, or whether
    # the API version is one the installed operator still serves. Each of those is valid YAML.
    #
    # Applied to a real API server for the first time, this directory produced four failures at once:
    # no namespace was created by anything, the metering DaemonSet was forbidden outright and had
    # been reporting desired 1 / current 0 in silence, and every External Secrets resource was
    # rejected because they declared `v1beta1` while current External Secrets serves only `v1`.
    #
    # That last one is the reason the schema catalogue is not enough on its own: the catalogue
    # carries a `v1beta1` schema and validates against it happily, forever, long after no cluster
    # will accept the version.
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `kindnet`, kind's default CNI, does not enforce NetworkPolicy — it accepts the objects and
      # ignores them. Tenant isolation is one of the two controls this design rests on, so a cluster
      # that silently ignores it can only manufacture confidence: every possible ingress rule
      # "passes", including one naming a pod that exists nowhere.
      - name: Create a cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: sproutos-ci
          config: .github/kind-cluster.yaml

      - name: Install Calico
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.31.0/manifests/calico.yaml
          kubectl -n kube-system rollout status ds/calico-node --timeout=420s

      # Pinned, not `latest`: an operator that changes its served API versions should break this job
      # in a diff that bumps the version, not on an unrelated morning.
      #
      # The release manifest bakes `namespace: default` into its objects, so it installs there and
      # not into `external-secrets`. That is fine for what this job needs — the CRDs and the
      # validating webhook, which is the code that actually decides whether these documents are
      # acceptable. Production installs the chart into its own namespace; this is not trying to
      # reproduce that, only to have a real operator present.
      - name: Install External Secrets
        run: |
          kubectl apply --server-side -f \
            https://github.com/external-secrets/external-secrets/releases/download/v2.9.0/external-secrets.yaml
          kubectl -n default rollout status deploy/external-secrets --timeout=300s
          kubectl -n default rollout status deploy/external-secrets-webhook --timeout=300s

      # Knative Serving and Kourier, because the tenant NetworkPolicies exist to let exactly this
      # data path through and nothing else. Without a real ingress in the cluster, the ingress rule
      # is a selector nobody evaluates — which is how it came to name a pod that has never existed
      # in any cluster, while every schema check passed.
      - name: Install Knative Serving
        run: |
          V=knative-v1.23.0
          kubectl apply -f "https://github.com/knative/serving/releases/download/$V/serving-crds.yaml"
          kubectl apply -f "https://github.com/knative/serving/releases/download/$V/serving-core.yaml"
          kubectl apply -f "https://github.com/knative/net-kourier/releases/download/$V/kourier.yaml"
          kubectl patch configmap/config-network -n knative-serving --type merge \
            -p '{"data":{"ingress-class":"kourier.ingress.networking.knative.dev"}}'
          kubectl patch configmap/config-domain -n knative-serving --type merge \
            -p '{"data":{"sprout.run":""}}'
          for d in controller webhook activator autoscaler; do
            kubectl -n knative-serving rollout status "deploy/$d" --timeout=300s
          done
          kubectl -n kourier-system rollout status deploy/3scale-kourier-gateway --timeout=300s

      - name: Render
        run: |
          cat > /tmp/outputs.json <<'JSON'
          {
            "aws_account_id": { "value": "123456789012" },
            "aws_region": { "value": "us-east-1" },
            "envelope_kms_key_arn": { "value": "arn:aws:kms:us-east-1:123456789012:key/x" },
            "database_credentials_secret_arn": { "value": "arn:aws:secretsmanager:us-east-1:123456789012:secret:x" }
          }
          JSON
          TAG=ci TENANT_NAMESPACE=tenant-ci TENANT_POSTGRES_HOST=pg.invalid \
          TENANT_VALKEY_HOST=valkey.invalid TENANT_OPENSEARCH_HOST=os.invalid \
            pnpm exec tsx bin/render-manifests.mjs /tmp/outputs.json > /tmp/rendered.yaml

      # No `|| true`. Every document has to be accepted, which is what makes the namespace ordering
      # and the External Secrets API version load-bearing rather than advisory.
      - name: Apply
        run: kubectl apply -f /tmp/rendered.yaml

      # The images are ECR references that cannot be pulled here, so the pods will not start — that
      # is fine and not what this checks. What it checks is that the API server *accepted* every pod
      # the controllers tried to create. A DaemonSet forbidden by a Pod Security Standard reports
      # desired > 0 with currentNumberScheduled 0 and no error anywhere else, which is exactly how
      # the metering agent went unnoticed.
      - name: Every controller could create its pods
        run: |
          sleep 20
          desired=$(kubectl get ds -n sproutos-metering metering-agent -o jsonpath='{.status.desiredNumberScheduled}')
          scheduled=$(kubectl get ds -n sproutos-metering metering-agent -o jsonpath='{.status.currentNumberScheduled}')
          echo "metering-agent: desired=$desired scheduled=$scheduled"
          if [ "$desired" != "$scheduled" ]; then
            echo "FAIL: the DaemonSet could not create a pod on every node it wants one on."
            kubectl describe ds -n sproutos-metering metering-agent | tail -20
            exit 1
          fi

          for deploy in internal-api website worker pg-proxy valkey-proxy search-proxy; do
            want=$(kubectl get deploy -n sproutos-system "$deploy" -o jsonpath='{.spec.replicas}')
            got=$(kubectl get deploy -n sproutos-system "$deploy" -o jsonpath='{.status.replicas}')
            echo "$deploy: spec=$want created=${got:-0}"
            if [ "${got:-0}" != "$want" ]; then
              echo "FAIL: $deploy could not create its pods."
              kubectl describe rs -n sproutos-system -l app.kubernetes.io/name="$deploy" | tail -20
              exit 1
            fi
          done

      # Accepted by the CRD *and* by the operator's validating webhook, which is a stronger check
      # than any schema: the webhook is the code that will actually read these in production.
      - name: External Secrets resources exist
        run: |
          count=$(kubectl get externalsecret -A --no-headers | wc -l)
          echo "$count ExternalSecret(s)"
          test "$count" -ge 5
          kubectl get clustersecretstore aws-secrets-manager

      # The one that matters. A tenant's application, in a namespace carrying `default-deny`,
      # reached through the gateway from outside it — and *only* through the gateway.
      #
      # This is the product: a customer's app, isolated, serving a request. It had never been run.
      # The ingress rule named a pod that does not exist, so no tenant application could receive a
      # request at all, while the Knative Service reported `Ready: True` throughout.
      - name: A tenant application serves a request, and only that way
        run: |
          kubectl apply -f - <<'YAML'
          apiVersion: serving.knative.dev/v1
          kind: Service
          metadata:
            name: hello
            namespace: tenant-ci
          spec:
            template:
              spec:
                containers:
                  - image: ghcr.io/knative/helloworld-go:latest
                    ports:
                      - containerPort: 8080
                    env:
                      - name: TARGET
                        value: SproutOS
                    # No `runAsNonRoot`. The tenant namespace enforces `baseline`, not `restricted`,
                    # precisely because customer images routinely run as root — and this sample is
                    # one of them. Asking for more here would test a stricter namespace than tenants
                    # actually get.
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                      seccompProfile:
                        type: RuntimeDefault
          YAML
          kubectl wait --for=condition=Ready ksvc/hello -n tenant-ci --timeout=420s

          # `sh -c` so the container's own shell parses the curl arguments. Passing them straight
          # through `kubectl run --` word-splits a quoted `-H 'Host: ...'` into pieces and curl
          # reports "no URL specified" — which looks exactly like a network denial and would have
          # made the negative assertion below pass for entirely the wrong reason.
          run_probe() {
            kubectl delete pod "$1" -n default --ignore-not-found >/dev/null
            kubectl run "$1" -n default --image=curlimages/curl:latest --restart=Never -- \
              sh -c "curl -sS -m 30 --fail-with-body $2" >/dev/null
            for _ in $(seq 1 25); do
              phase=$(kubectl get pod "$1" -n default -o jsonpath='{.status.phase}' 2>/dev/null || true)
              case "$phase" in Succeeded|Failed) break;; esac
              sleep 4
            done
            echo "$phase"
          }

          # Through the gateway: must work. This is a customer's application serving traffic.
          got=$(run_probe allowed "-H 'Host: hello.tenant-ci.sprout.run' http://kourier-internal.kourier-system.svc.cluster.local/")
          echo "via gateway: $got"
          kubectl logs -n default allowed || true
          if [ "$got" != "Succeeded" ]; then
            echo "FAIL: the tenant application could not be reached through the gateway."
            kubectl describe networkpolicy -n tenant-ci
            exit 1
          fi

          # Straight at the pod: must NOT work. Without this half the test above passes just as
          # happily on a cluster whose CNI ignores NetworkPolicy altogether, which is exactly the
          # false negative that let the broken ingress rule survive.
          ip=$(kubectl get pods -n tenant-ci -l serving.knative.dev/service=hello \
                 -o jsonpath='{.items[0].status.podIP}')
          got=$(run_probe denied "http://$ip:8012/")
          echo "direct to pod $ip: $got"
          if [ "$got" != "Failed" ]; then
            echo "FAIL: a pod outside the tenant namespace reached a tenant pod directly."
            echo "Either default-deny is not applied, or the CNI is not enforcing NetworkPolicy."
            exit 1
          fi
