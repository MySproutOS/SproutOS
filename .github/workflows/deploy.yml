# Build the two services, upload them, fill the idle colour, and cut over.
#
# The router remains a blue/green EC2 release tarball. The website, API and worker can move as one
# ECS-on-EC2 service behind the `ECS_WEB_ENABLED` repository gate; customer code remains Lambda.
# Keeping both deployment paths during the transition is intentional, but the gate makes them
# mutually exclusive for website fill, migration and cutover.
#
# **The cutover is a separate, manual job.** Filling the idle colour is safe and reversible — it
# touches nothing serving traffic — so it runs on dispatch. Moving traffic is neither, so it is its
# own job with its own approval gate, and `bin/cutover.sh` refuses to move to a colour with no
# healthy targets.
name: Deploy

on:
  # Every push to main deploys. A branch that is the deployed thing is the only version of this that
  # stays true — a manual step turns "what is on main" into "what somebody remembered to run", and
  # the two drift silently. The favicon sat built and undeployed for exactly that reason.
  #
  # The cutover still moves traffic only when the fill has passed its health checks, so a push that
  # produces a broken release fills the idle colour, fails, and leaves production untouched.
  push:
    branches: [main]
    paths-ignore:
      # Nothing here changes what runs, and a docs commit should not replace every instance.
      - "docs/**"
      - "**/*.md"
      - "private_notes/**"

  workflow_dispatch:
    inputs:
      service:
        description: Which service to release
        required: true
        type: choice
        options: [website, router, both]
        default: both
      cutover:
        description: Move traffic after the release is healthy
        required: false
        type: boolean
        default: false
      publish_log_extension:
        description: Build and publish a new log-extension layer (website release only)
        required: false
        type: boolean
        default: false
      ecs_image_tag:
        description: Optional existing 12-character Git SHA image tag for an explicit ECS rollback
        required: false
        type: string

concurrency:
  # One release at a time. Two concurrent runs would write the same pointer object and leave the
  # instances that booted between them on different versions.
  group: deploy
  cancel-in-progress: false

permissions:
  # For the OIDC token that assumes the deploy role. No long-lived AWS keys in the repository —
  # `tofu/oidc.tf` trusts this workflow by repository and branch, not a secret somebody could copy.
  id-token: write
  contents: read
  # Publishing the image to GHCR, which authenticates with the job's own GITHUB_TOKEN. No registry
  # credential is stored anywhere: the token exists for the life of the run and GHCR trusts it
  # because it was issued for this repository.
  packages: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  NAME_PREFIX: ${{ vars.NAME_PREFIX }}

jobs:
  release:
    name: Build and upload
    # arm64 runners, because arm64 is what this ships to.
    #
    # Both halves of the release are architecture-specific and both were wrong on an x86 runner:
    #
    # - The router is a static `aarch64-unknown-linux-musl` binary. Cross-compiling it needs a C
    # toolchain for the target — `ring` has a build script — and the runner has none, so the build
    # died with `failed to find tool "aarch64-linux-musl-gcc"`. On arm64 this is a *native* musl
    # build and `musl-tools` is all it takes.
    # - The API's dependency tree contains per-platform optional binaries — 300 MB of
    # `@anthropic-ai/claude-agent-sdk` among them — and `pnpm deploy --prod` resolves them for the
    # host it runs on. An x86 runner would have quietly put `linux-x64` into a tarball bound for
    # Graviton, which is the same mistake a macOS laptop makes with `darwin-arm64` and just as
    # silent: nothing fails until the instance tries to run it.
    #
    # Building on the target architecture makes both correct by construction rather than by flag.
    runs-on: ubuntu-24.04-arm
    strategy:
      # Fail the whole release if either service fails to build. A half-released pair is worse than
      # no release: the cutover would move traffic to instances running one new service and one old.
      fail-fast: true
      matrix:
        service: ${{ (inputs.service || 'both') == 'both' && fromJSON('["website","router"]') || fromJSON(format('["{0}"]', inputs.service)) }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # No submodules. The public Android client supports anonymous checkout, while deploy-action is
      # a separate repository; neither is an input to these website/router images. Avoiding both here
      # keeps a customer-facing Action change or Android checkout failure from blocking an unrelated
      # control-plane release.
      - uses: actions/checkout@v5

      - id: version
        # The commit, not a timestamp or a run number: a release names the tree it was built from,
        # so "what is production running" and "what does that code do" are one lookup.
        run: echo "version=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build the router
        if: matrix.service == 'router'
        run: |
          # `ring` and `lz4` have build scripts that compile C. On an arm64 host this is a native
          # musl build, so the stock cross-compiler is all that is missing.
          sudo apt-get update -qq && sudo apt-get install -y musl-tools
          rustup target add aarch64-unknown-linux-musl
          cargo build --release --target aarch64-unknown-linux-musl -p router -p storage-proxy

      - name: Build the website and the API
        if: matrix.service == 'website'
        run: pnpm run build --filter=website --filter=@api/internal
        env:
          # Baked into the HTML at build time, so it cannot be changed by a later deploy step. Unset,
          # the website serves its own assets and everything still works — which is what makes this
          # safe to roll out before the bucket variable exists.
          NEXT_PUBLIC_ASSET_BASE: ${{ vars.ASSET_BASE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || format('https://api.{0}', vars.CONTROL_PLANE_DOMAIN || 'sproutos.me') }}
          NEXT_PUBLIC_HOST_URL: ${{ vars.NEXT_PUBLIC_HOST_URL || format('https://{0}', vars.CONTROL_PLANE_DOMAIN || 'sproutos.me') }}

      - name: Build and verify the Lambda log extension
        if: matrix.service == 'website' && inputs.publish_log_extension == true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y musl-tools
          rustup target add aarch64-unknown-linux-musl
          cargo build --release --target aarch64-unknown-linux-musl -p log-extension
          bin/package-log-extension.sh \
            target/aarch64-unknown-linux-musl/release/log-extension \
            "$RUNNER_TEMP/log-extension.zip"

      - name: Package
        run: |
          staging="$RUNNER_TEMP/stage"
          mkdir -p "$staging"

          if [ "${{ matrix.service }}" = "router" ]; then
            cp target/aarch64-unknown-linux-musl/release/router "$staging/router"
            cp target/aarch64-unknown-linux-musl/release/storage-proxy "$staging/storage-proxy"
            cat > "$staging/start" <<'START'
          #!/bin/bash
          set -u

          /opt/sproutos/router &
          router_pid=$!

          # Object storage is a sibling data-plane endpoint, not the router's life-support system.
          # Restart it locally when it fails, while leaving the front door, LLM, search, Postgres,
          # Valkey and egress listeners alive. Its own target-group health prevents a release from
          # moving storage traffic to a broken child.
          storage_loop() {
            storage_pid=""
            stop_storage() {
              if [ -n "$storage_pid" ]; then
                kill -TERM "$storage_pid" 2>/dev/null || true
                wait "$storage_pid" 2>/dev/null || true
              fi
              exit 0
            }
            trap stop_storage TERM INT

            while kill -0 "$router_pid" 2>/dev/null; do
              /opt/sproutos/storage-proxy &
              storage_pid=$!
              wait "$storage_pid"
              status=$?
              storage_pid=""
              echo "storage-proxy exited with $status; restarting without stopping router" >&2
              sleep 2
            done
          }
          storage_loop &
          storage_supervisor_pid=$!

          stop_all() {
            kill -TERM "$router_pid" "$storage_supervisor_pid" 2>/dev/null || true
            wait "$router_pid" "$storage_supervisor_pid" 2>/dev/null || true
          }
          trap 'stop_all; exit 143' TERM INT

          set +e
          wait "$router_pid"
          status=$?
          stop_all
          exit "$status"
          START
          else
            # Two processes in one release, because `api.<domain>` and the apex are served by the
            # same instances on different ports — see the `api` target group in `compute.tf`. They
            # ship together so a release can never leave the website on a new version and the API
            # on an old one.
            cp -r apps/website/.next/standalone/. "$staging/"

            # `.next/static` and `public/`, which standalone deliberately leaves out.
            #
            # Next's tracing excludes them because it assumes a CDN serves them, so the standalone
            # output is the server and its modules and nothing a browser downloads. Shipping only
            # that produces a site that renders, returns 200 for every page, and 404s every stylesheet
            # and chunk — the HTML is correct and the page is unstyled, which no health check and no
            # `curl` of `/` will ever notice.
            cp -r apps/website/.next/static "$staging/apps/website/.next/static"
            if [ -d apps/website/public ]; then
              cp -r apps/website/public "$staging/apps/website/public"
            fi

            mkdir -p "$staging/api"
            cp -r apps/internal-api/build/. "$staging/api/"

            # `pnpm deploy --prod`, not a copy of the workspace's `node_modules`.
            #
            # `build.mjs` bundles this app's own source but leaves real npm dependencies external —
            # deliberately, since `pg` and the AWS SDK resolve files relative to their own directory
            # and break when inlined. So the release does need a `node_modules`, but only the
            # production half: copying the workspace tree ships vitest, typescript and every other
            # dev dependency, which measured 1.2 GB against 500 MB for this.
            #
            # It also has to be resolved on the *target's* platform. Several dependencies have
            # per-platform optional binaries — `@anthropic-ai/claude-agent-sdk` is 300 MB of them —
            # and a tree resolved on a developer's macOS laptop puts `darwin-arm64` into a tarball
            # bound for Linux. This runner is Linux, which is the point of building here.
            #
            # `node-linker=hoisted`, because the bundle's dependencies are not this app's.
            #
            # esbuild inlines the workspace packages — `@lib/lambda`, `@lib/dao` and the rest — so
            # *their* npm dependencies become the bundle's, resolved from wherever `server.js`
            # sits. pnpm's default isolated layout links into the top-level `node_modules` only what
            # `apps/internal-api/package.json` itself declares, so the bundle started and died on
            # `Cannot find package '@aws-sdk/client-lambda'` — a package that was installed, three
            # directories away under `.pnpm`, and simply not resolvable from there.
            #
            # A hoisted layout puts every package at the top level, which is exactly the shape a
            # bundle needs. The alternative is to restate every transitive dependency of every
            # bundled workspace package in this app's own `dependencies`, and keep doing it.
            pnpm --filter=@api/internal deploy --prod --legacy \
              --config.node-linker=hoisted "$RUNNER_TEMP/apidep"
            cp -r "$RUNNER_TEMP/apidep/node_modules" "$staging/api/node_modules"

            # The migrator, next to the API so it resolves the API's `node_modules`.
            #
            # `deploy.ts` finds its migrations relative to its own module URL, so the bundle landing
            # at `/opt/sproutos/api/migrate.mjs` makes it read `/opt/sproutos/api/migrations` — which
            # is why the two are staged as a pair and not somewhere tidier.
            #
            # Built with the API's own `build.mjs`: it takes an entry and an outfile, and computes
            # externals by walking workspace dependencies through to the npm packages underneath.
            # `apps/dbmigrator` sits at the same depth as `apps/internal-api`, so its notion of the
            # workspace root holds. The bundle needs `kysely`, `pg` and `dotenv` at runtime, all of
            # which the API's production tree already carries.
            (cd apps/dbmigrator && node ../internal-api/build.mjs src/cli.ts "$staging/api/migrate.mjs")

            # Migrations stay separate files rather than being bundled in: `FileMigrationProvider`
            # reads the directory and imports each one, and a migration inlined into the bundle is a
            # migration the provider cannot see or record by name.
            pnpm --filter=dbmigrator exec esbuild "src/migrations/*.ts" \
              --platform=node --format=esm --target=node24 \
              --outdir="$staging/api/migrations"

            # The seeds, same shape and for the same reason as the migrations: separate files the
            # runner reads from a directory, next to a bundle that resolves the API's node_modules.
            #
            # Deployed because one of them is load-bearing. Without `0001_price_book` the usage
            # route answers 409 "No active price book; usage cannot be rated" — which is what the
            # dashboard's balance widget hung on, and is far better than rating every tenant against
            # an empty price book and billing zero.
            (cd apps/dbmigrator && node ../internal-api/build.mjs src/seed-entry.ts "$staging/api/seed.mjs")

            # `--bundle`, unlike the migrations above. A migration imports only `kysely`; a seed
            # also imports `../lib/rows` and friends, and compiling each file on its own leaves
            # those relative specifiers pointing at a directory the release does not ship —
            # `ERR_MODULE_NOT_FOUND: /opt/sproutos/api/lib/rows`. Bundling inlines them.
            pnpm --filter=dbmigrator exec esbuild "src/seeds/*.ts" \
              --bundle --packages=external \
              --platform=node --format=esm --target=node24 \
              --outdir="$staging/api/seeds"

            # ClickHouse's schema, which had no delivery path at all.
            #
            # `ensureSchema()` was called from two places and both were tests, so `log_record`
            # existed on every developer's machine and on no deployment. The log viewer answered
            # "Unknown table expression identifier 'log_record'" — a table that is in the repository
            # and was never carried to the machine that needed it.
            (cd apps/dbmigrator && node ../internal-api/build.mjs src/clickhouse-entry.ts "$staging/api/clickhouse.mjs")

            # `wait -n` then exit, rather than backgrounding and returning: systemd's unit is
            # `Type=simple` with one `ExecStart`, so this script *is* the service. Returning while
            # children ran would have systemd call the service dead and restart it in a loop;
            # waiting for all of them would let one crashed process go unnoticed. Exiting when the
            # first child does makes systemd restart the set, which is the only honest state — the
            # release is all three processes or it is not running.
            #
            # **The worker is one of the three, and it was missing.** `apps/internal-api/build.mjs`
            # has always emitted `worker.js` beside `server.js` and the `cp -r` above has always
            # shipped it; nothing ever ran it. So every enqueued job on this platform sat at
            # `queued` forever: project provisioning never created a repository, `deploy.release`
            # never published a Lambda, the billing rollup never turned a metered event into a
            # number a customer could see, retention never swept, and fork upkeep never scanned.
            #
            # None of it errored. `enqueue` returns a row and the API answers 201 with a job id the
            # dashboard then polls, so a project stayed at "creating" with four pending steps and no
            # failure anywhere — `docs/findings/0006-features-with-no-executor.md`, at the scale of
            # the whole queue. Found by creating a project on prod and watching the job not move.
            #
            # Written line by line rather than with a heredoc: a heredoc's terminator has to sit at
            # column zero, and inside a YAML block scalar every line is already indented.
            {
              echo '#!/usr/bin/env bash'
              echo 'set -euo pipefail'
              echo 'node /opt/sproutos/api/server.js &'
              echo 'node /opt/sproutos/api/worker.js &'
              echo 'node /opt/sproutos/apps/website/server.js &'
              echo 'wait -n'
              echo 'exit 1'
            } > "$staging/start"
          fi

          chmod +x "$staging/start"
          tar -czf "$RUNNER_TEMP/${{ matrix.service }}.tar.gz" -C "$staging" .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.NAME_PREFIX }}-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Static assets to the CDN, before the release pointer moves.
      #
      # Ordering matters and is the same reason the tarball is uploaded before the pointer: the HTML
      # a running instance serves references these by hashed filename, so a browser must never be
      # able to ask for a chunk the CDN has not got yet. Publishing first makes the window empty
      # rather than small.
      #
      # `--cache-control immutable` because the names are content hashes: a changed asset is a new
      # key, never a new version of an old one, so nothing here can go stale.
      - name: Publish static assets
        if: matrix.service == 'website'
        run: |
          assets="${{ vars.ASSET_BUCKET }}"
          if [ -z "$assets" ]; then
            echo "::notice::ASSET_BUCKET is unset; the website will serve its own assets."
            exit 0
          fi

          aws s3 sync apps/website/.next/static "s3://$assets/_next/static" \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors

      - name: Publish the Lambda log extension
        if: matrix.service == 'website' && inputs.publish_log_extension == true
        run: |
          layer_arn=$(aws lambda publish-layer-version \
            --layer-name "${NAME_PREFIX}-log-extension" \
            --description "SproutOS log extension ${GITHUB_SHA}" \
            --zip-file "fileb://$RUNNER_TEMP/log-extension.zip" \
            --compatible-architectures arm64 \
            --query LayerVersionArn --output text)
          case "$layer_arn" in
            arn:aws:lambda:*:*:layer:"${NAME_PREFIX}-log-extension":*) ;;
            *) echo "::error::Lambda returned an unexpected layer ARN: $layer_arn"; exit 1 ;;
          esac
          aws ssm put-parameter \
            --name "/${NAME_PREFIX}/application/LOG_EXTENSION_LAYER_ARN" \
            --type SecureString \
            --key-id "alias/${NAME_PREFIX}-secrets" \
            --value "$layer_arn" \
            --overwrite

      - name: Upload
        run: |
          bucket="${{ vars.NAME_PREFIX }}-artifacts"
          version="${{ steps.version.outputs.version }}"

          # The tarball first, the pointer second. An instance that booted between the two would
          # otherwise read a pointer naming an object that is not there yet and fail its bootstrap.
          aws s3 cp "$RUNNER_TEMP/${{ matrix.service }}.tar.gz" \
            "s3://$bucket/releases/${{ matrix.service }}/$version.tar.gz"
          printf '%s' "$version" | aws s3 cp - \
            "s3://$bucket/releases/${{ matrix.service }}/current"

  image:
    name: Build and publish the image
    # arm64, because the instances are Graviton and a multi-arch build would spend most of its time
    # producing a variant nothing pulls.
    runs-on: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - id: meta
        run: |
          # Lowercased: image references are case-sensitive and the registry rejects an uppercase
          # path, while ${{ github.repository }} carries the repository's own casing.
          owner=$(echo "${{ github.repository_owner }}" | tr '"'"'[:upper:]'"'"' '"'"'[:lower:]'"'"')
          echo "image=ghcr.io/$owner/sproutos-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/website/Dockerfile
          platforms: linux/arm64
          push: true
          # Two tags: the commit, which is what a task definition should ever name, and `main`,
          # which is what a human looking at the registry expects to find. Deployments use the
          # commit — `main` moving under a running service is how you lose track of what is running.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ needs.release.outputs.version }}
            ${{ steps.meta.outputs.image }}:main
          # The registry as the layer cache. A code-only change then reuses the dependency layer
          # rather than rebuilding 500 MB of node_modules on a runner with a cold disk.
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max
    needs: release

  ecs_web:
    name: Migrate and deploy the ECS website
    needs: [release, image]
    # ECS owns the website only after the repository switch is deliberate. A manual run without
    # `cutover` remains a build/stage operation, matching the legacy workflow; a push to main and
    # an explicitly approved manual cutover both deploy.
    if: >-
      ${{ vars.ECS_WEB_ENABLED == 'true' &&
          ((inputs.service || 'both') == 'website' || (inputs.service || 'both') == 'both') &&
          (github.event_name == 'push' || inputs.cutover) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.NAME_PREFIX }}-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Run the image's migrations, update ECS, and pin traffic to green
        run: bin/deploy-ecs-web.sh --cutover
        env:
          IMAGE: ${{ needs.image.outputs.image }}:${{ inputs.ecs_image_tag || needs.release.outputs.version }}
          ECS_WEB_DESIRED_COUNT: ${{ vars.ECS_WEB_DESIRED_COUNT || '1' }}
          LISTENER_ARN: ${{ vars.LISTENER_ARN }}
          WEBSITE_RULE_ARN: ${{ vars.WEBSITE_RULE_ARN }}
          API_RULE_ARN: ${{ vars.API_RULE_ARN }}

  spa:
    name: Publish the dashboard and admin
    runs-on: ubuntu-latest
    # Independent of the release: these are static bundles behind a CDN, not instances, so there is
    # no colour to fill and nothing to cut over. A failure here leaves the previous bundle serving.
    #
    # Unconditional, with no path filter. Upstream filters on `apps/frontends/**` and the shared
    # libraries, which is right for a repository whose SPAs are already published — and wrong here,
    # where they never have been. The first version of this job carried those filters, ran on a
    # commit that touched only `.github/` and `tofu/`, skipped every step and reported success
    # having uploaded nothing. A green job and an empty bucket is the failure `cutover.sh` warns
    # about in its own comments: worse than an error, because the release looks done.
    #
    # The build is a couple of seconds and `s3 sync` only transfers what differs, so running every
    # time costs almost nothing and removes a class of silent skip.
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # One at a time, because both configs read the same `VITE_ASSET_BASE` and each needs a
      # different value — a single `--filter=dashboard --filter=admin` run would give them one.
      #
      # The base is an absolute CDN URL including the folder, which is what upstream hardcodes and
      # this parameterises. It means a browser fetches the bundle straight from CloudFront; only
      # `index.html` is ever proxied through the origin.
      #
      # `NEXT_PUBLIC_API_URL` is required rather than optional: `vite-define.mjs` refuses a
      # production build without it, and refuses a localhost value, because either produces a bundle
      # that sends authenticated requests to the wrong origin and reads as a silent sign-out.
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || format('https://api.{0}', vars.CONTROL_PLANE_DOMAIN || 'sproutos.me') }}
          VITE_NEXTJS_URL: ${{ vars.NEXT_PUBLIC_HOST_URL || format('https://{0}', vars.CONTROL_PLANE_DOMAIN || 'sproutos.me') }}
          # Public by design — it identifies the account to Stripe.js and can do nothing
          # alone. A variable rather than a secret, so a build log showing it is not an incident.
          STRIPE_PUBLIC_KEY: ${{ vars.STRIPE_PUBLIC_KEY }}
        run: |
          VITE_ASSET_BASE="${{ vars.ASSET_BASE_URL }}/dashboard/" pnpm run build --filter=dashboard
          VITE_ASSET_BASE="${{ vars.ASSET_BASE_URL }}/admin/" pnpm run build --filter=admin

      # The role built for this, not the release role. It can write these two prefixes and
      # invalidate this distribution, and nothing else — a deploy of the website has no business
      # rewriting the dashboard, and vice versa.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-spa-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish
        run: |
          assets="${{ vars.ASSET_BUCKET }}"
          if [ -z "$assets" ]; then
            echo "::error::ASSET_BUCKET is unset, so /dashboard will 404 after a successful login."
            exit 1
          fi

          # `index.html` is excluded from the immutable sync and written separately with
          # `no-cache`. Its name never changes, so caching it the way the hashed chunks are cached
          # would pin every visitor to whichever release was current when they first arrived.
          for spa in dashboard admin; do
            src="apps/frontends/$spa/dist"
            [ -d "$src" ] || { echo "::error::$src does not exist"; exit 1; }

            aws s3 sync "$src" "s3://$assets/$spa" \
              --exclude "index.html" \
              --cache-control "public,max-age=31536000,immutable" \
              --delete --only-show-errors

            aws s3 cp "$src/index.html" "s3://$assets/$spa/index.html" \
              --cache-control "no-cache,must-revalidate" \
              --content-type "text/html" --only-show-errors
          done

          # A copy at the bucket root, because that is the path a browser asks for on its own and
          # the path `proxy.ts` rewrites to the CDN once a visitor is signed in. Without it that
          # request 403s, falls through the distribution's SPA error mapping, and returns
          # `index.html` with a 200 — the browser is handed HTML where an icon should be and shows
          # no icon at all, with nothing logged anywhere.
          aws s3 cp apps/frontends/dashboard/dist/favicon.ico "s3://$assets/favicon.ico" \
            --cache-control "public,max-age=86400" \
            --content-type "image/x-icon" --only-show-errors

          # Read back rather than trust the exit status. `s3 sync` succeeds cheerfully when its
          # source is an empty directory, so "the command worked" and "the bundle is published" are
          # different claims and only one of them matters.
          for spa in dashboard admin; do
            n=$(aws s3 ls "s3://$assets/$spa/" --recursive | grep -c . || true)
            echo "$spa: $n object(s) in the bucket"
            [ "$n" -gt 0 ] || { echo "::error::$spa published nothing"; exit 1; }
          done

          # Only the two entry points: everything else is content-hashed, so a release is new keys
          # rather than new versions of old ones. `/*` would be slower and, past the free thousand
          # paths a month, billed.
          if [ -n "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
              --paths "/dashboard/index.html" "/admin/index.html" "/favicon.ico" \
              --query 'Invalidation.Id' --output text
          else
            echo "::warning::CLOUDFRONT_DISTRIBUTION_ID is unset; the previous index.html serves until the cache expires."
          fi

  fill:
    name: Start the idle colour
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.NAME_PREFIX }}-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Scale the idle groups up and wait for health
        run: |
          requested="${{ inputs.service || 'both' }}"
          case "$requested" in
            both) services="website router" ;;
            website|router) services="$requested" ;;
            *) echo "::error::unknown service: $requested"; exit 2 ;;
          esac

          # ECS has one permanent green service target. Once enabled, putting legacy website
          # instances into either colour would mix two runtimes in one target group or resurrect
          # the blue estate after the deliberate transition. Router blue/green remains unchanged.
          if [ "${ECS_WEB_ENABLED:-}" = "true" ]; then
            services="${services//website/}"
          fi
          services="${services# }"
          services="${services% }"
          if [ -z "$services" ]; then
            echo "website is ECS-managed; no legacy colour to fill"
            exit 0
          fi

          SERVICES="$services" bin/fill-idle.sh
        env:
          LISTENER_ARN: ${{ vars.LISTENER_ARN }}
          WEBSITE_RULE_ARN: ${{ vars.WEBSITE_RULE_ARN }}
          # The API's rule moves with the website's — one release on two ports, so they can never be
          # different colours. `cutover.sh` requires it rather than defaulting, because a cutover
          # that silently moved only half of a deployment would point the API at the colour the
          # website had just drained.
          API_RULE_ARN: ${{ vars.API_RULE_ARN }}
          # Optional: an estate with no OpenSearch behind it has no such rule, and `cutover.sh`
          # moves the router alone rather than refusing.
          SEARCH_RULE_ARN: ${{ vars.SEARCH_RULE_ARN }}
          STORAGE_RULE_ARN: ${{ vars.STORAGE_RULE_ARN }}
          # The model endpoint is another rule on the router instances. Omitting it leaves Claude
          # pointed at the colour this job drains to zero, while the router's primary listener
          # still makes the deployment look healthy.
          LLM_RULE_ARN: ${{ vars.LLM_RULE_ARN }}
          # The tenant load balancer's listeners. Optional in the same way: an estate without one
          # simply omits it from the atomic router cutover.
          PG_LISTENER_ARN: ${{ vars.PG_LISTENER_ARN }}
          VALKEY_LISTENER_ARN: ${{ vars.VALKEY_LISTENER_ARN }}
          FORWARD_PROXY_LISTENER_ARN: ${{ vars.FORWARD_PROXY_LISTENER_ARN }}
          TENANT_HTTPS_TARGET_GROUP_SHORT: ${{ vars.TENANT_HTTPS_TARGET_GROUP_SHORT }}
          TENANT_HTTP_LISTENER_ARN: ${{ vars.TENANT_HTTP_LISTENER_ARN }}
          ECS_WEB_ENABLED: ${{ vars.ECS_WEB_ENABLED }}
          DESIRED: ${{ vars.SERVICE_DESIRED_COUNT || '2' }}

  migrate:
    name: Apply migrations and seeds
    needs: fill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.NAME_PREFIX }}-deploy
          aws-region: ${{ env.AWS_REGION }}

      # After the fill and before the cutover, which is the only ordering that is not a broken
      # window. Before the fill would migrate from instances running the *previous* release, whose
      # migrator predates the schema being asked for. After the cutover would put traffic on code
      # that expects tables it does not yet have — which is exactly how production came to answer
      # 500 on `/login/github/callback` with `relation "account" does not exist`.
      #
      # The idle instances are not serving, so a migration that fails here stops the release with
      # production still on the old colour and untouched.
      - name: Migrate and seed
        run: |
          requested="${{ inputs.service || 'both' }}"
          if [ "${ECS_WEB_ENABLED:-}" = "true" ]; then
            echo "website migrations run from the immutable ECS image"
            exit 0
          fi
          if [ "$requested" = "router" ]; then
            echo "router-only release has no control-plane migration"
            exit 0
          fi
          bin/migrate.sh
        env:
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
          WEBSITE_RULE_ARN: ${{ vars.WEBSITE_RULE_ARN }}
          ECS_WEB_ENABLED: ${{ vars.ECS_WEB_ENABLED }}

  cutover:
    name: Move traffic
    needs: [fill, migrate, image, ecs_web]
    # A push deploys all the way. A manual run keeps its opt-in, because the reason to dispatch by
    # hand is usually to stage something without moving traffic.
    if: >-
      ${{ always() && needs.fill.result == 'success' && needs.migrate.result == 'success' &&
          ((vars.ECS_WEB_ENABLED == 'true' && (inputs.service || 'both') != 'router' &&
            needs.ecs_web.result == 'success' && needs.image.result == 'success') ||
           ((vars.ECS_WEB_ENABLED != 'true' || (inputs.service || 'both') == 'router') &&
            needs.ecs_web.result == 'skipped')) &&
          (github.event_name == 'push' || inputs.cutover) }}
    runs-on: ubuntu-latest
    # A protected environment, so moving production traffic asks a person first. The release and
    # the fill do not: they change nothing that is serving.
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.NAME_PREFIX }}-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Cut over
        run: |
          requested="${{ inputs.service || 'both' }}"
          case "$requested" in
            both) services="website router" ;;
            website|router) services="$requested" ;;
            *) echo "::error::unknown service: $requested"; exit 2 ;;
          esac
          if [ "${ECS_WEB_ENABLED:-}" = "true" ]; then
            services="${services//website/}"
          fi
          for service in $services; do
            bin/cutover.sh "$service"
          done
        env:
          ECS_WEB_ENABLED: ${{ vars.ECS_WEB_ENABLED }}
          LISTENER_ARN: ${{ vars.LISTENER_ARN }}
          WEBSITE_RULE_ARN: ${{ vars.WEBSITE_RULE_ARN }}
          # The API's rule moves with the website's — one release on two ports, so they can never be
          # different colours. `cutover.sh` requires it rather than defaulting, because a cutover
          # that silently moved only half of a deployment would point the API at the colour the
          # website had just drained.
          API_RULE_ARN: ${{ vars.API_RULE_ARN }}
          # Optional: an estate with no OpenSearch behind it has no such rule, and `cutover.sh`
          # moves the router alone rather than refusing.
          SEARCH_RULE_ARN: ${{ vars.SEARCH_RULE_ARN }}
          STORAGE_RULE_ARN: ${{ vars.STORAGE_RULE_ARN }}
          # Kept in both fill and cutover environments. Fill may use it to extend health coverage;
          # cutover must have it now so model traffic follows the router colour before drain.
          LLM_RULE_ARN: ${{ vars.LLM_RULE_ARN }}
          # The tenant load balancer's listeners. Optional in the same way: an estate without one
          # simply omits it from the atomic router cutover.
          PG_LISTENER_ARN: ${{ vars.PG_LISTENER_ARN }}
          VALKEY_LISTENER_ARN: ${{ vars.VALKEY_LISTENER_ARN }}
          FORWARD_PROXY_LISTENER_ARN: ${{ vars.FORWARD_PROXY_LISTENER_ARN }}
          TENANT_HTTPS_TARGET_GROUP_SHORT: ${{ vars.TENANT_HTTPS_TARGET_GROUP_SHORT }}
          TENANT_HTTP_LISTENER_ARN: ${{ vars.TENANT_HTTP_LISTENER_ARN }}
