# Build the platform images and render the manifests that reference them.
#
# Deliberately stops short of applying anything. Nothing here has ever run against a cluster, and a
# workflow that would `kubectl apply` on merge — written blind, never rehearsed — is a worse artefact
# than one that builds the inputs and hands them over. The apply step is the line where this needs a
# real account and a real rehearsal, and it is left for whoever has both.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment's OpenTofu workspace to read outputs from
        required: true
        default: production

concurrency:
  # One deploy at a time per environment. Two concurrent runs would push images under the same tag
  # and render manifests from whichever finished last, which is a deploy nobody chose.
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  # For the OIDC token that assumes the deploy role. No long-lived AWS keys in the repository —
  # `tofu/oidc.tf` is what trusts this workflow, and it trusts the repository and branch, not a
  # secret somebody could copy.
  id-token: write
  contents: read

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - website
          - internal-api
          - worker
          - pg-proxy
          - valkey-proxy
          - search-proxy
          - metering-agent
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/sproutos-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      # arm64 only. One architecture is the whole point of the Graviton decision: one build of every
      # image, one set of base layers, and no class of bug that appears on one node type.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/arm64
          push: true
          # The commit, not `latest`. The ECR repositories are `IMMUTABLE`, so a tag means one image
          # forever — which is what makes a rollback roll back rather than forward.
          tags: ${{ steps.ecr.outputs.registry }}/sproutos/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  render:
    name: Render manifests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.10.6"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/sproutos-deploy
          aws-region: ${{ vars.AWS_REGION }}

      # The values come from the infrastructure that exists, not from repository variables that
      # claim to describe it. An output is what was applied; a variable is what somebody typed.
      - name: Read infrastructure outputs
        working-directory: tofu
        run: |
          tofu init -input=false
          tofu workspace select ${{ inputs.environment }}
          tofu output -json > "$RUNNER_TEMP/outputs.json"

      - name: Render
        env:
          TAG: sha-${{ github.sha }}
          TENANT_NAMESPACE: ${{ vars.TENANT_NAMESPACE }}
          TENANT_POSTGRES_HOST: ${{ vars.TENANT_POSTGRES_HOST }}
          TENANT_VALKEY_HOST: ${{ vars.TENANT_VALKEY_HOST }}
          TENANT_OPENSEARCH_HOST: ${{ vars.TENANT_OPENSEARCH_HOST }}
          # `0.0.0.0/0` when pushing to public ECR, where the rule it fills costs nothing. Set to
          # the endpoint's subnet when pushing through a VPC interface endpoint, whose address is
          # private and would otherwise be blocked by the build egress policy.
          BUILD_REGISTRY_CIDR: ${{ vars.BUILD_REGISTRY_CIDR }}
        # Exits non-zero if any placeholder is left unsubstituted, which is the entire reason the
        # renderer is a tested module rather than a `sed` — an unsubstituted placeholder is valid
        # YAML that fails at image pull in production.
        run: pnpm exec tsx bin/render-manifests.mjs "$RUNNER_TEMP/outputs.json" > "$RUNNER_TEMP/rendered.yaml"

      # Validated *after* rendering as well as before. The checked-in manifests are schema-valid with
      # placeholders in them; this checks the thing that would actually be applied, which is a
      # different document.
      - uses: terraform-linters/setup-tflint@v4
      - name: Validate the rendered output
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.34.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$RUNNER_TEMP/rendered.yaml"

      - uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests-${{ github.sha }}
          path: ${{ runner.temp }}/rendered.yaml
          retention-days: 30

      - name: What this does not do
        run: |
          echo "::notice::Manifests rendered and validated, not applied."
          echo "::notice::Applying needs a cluster, a rehearsal, and the migration Job — none of which exist yet."
