# Build the two services, upload them, fill the idle colour, and cut over.
#
# This replaces a workflow that built container images and rendered Kubernetes manifests. There is
# no cluster (ADR 0026): the website and the router run on EC2 from a release tarball, and customer
# code runs on Lambda from an archive their own GitHub Action uploads.
#
# **The cutover is a separate, manual job.** Filling the idle colour is safe and reversible — it
# touches nothing serving traffic — so it runs on dispatch. Moving traffic is neither, so it is its
# own job with its own approval gate, and `bin/cutover.sh` refuses to move to a colour with no
# healthy targets.
name: Deploy

on:
  # Every push to main deploys. A branch that is the deployed thing is the only version of this that
  # stays true — a manual step turns "what is on main" into "what somebody remembered to run", and
  # the two drift silently. The favicon sat built and undeployed for exactly that reason.
  #
  # The cutover still moves traffic only when the fill has passed its health checks, so a push that
  # produces a broken release fills the idle colour, fails, and leaves production untouched.
  push:
    branches: [main]
    paths-ignore:
      # Nothing here changes what runs, and a docs commit should not replace every instance.
      - "docs/**"
      - "**/*.md"
      - "private_notes/**"

  workflow_dispatch:
    inputs:
      service:
        description: Which service to release
        required: true
        type: choice
        options: [website, router, both]
        default: both
      cutover:
        description: Move traffic after the release is healthy
        required: false
        type: boolean
        default: false

concurrency:
  # One release at a time. Two concurrent runs would write the same pointer object and leave the
  # instances that booted between them on different versions.
  group: deploy
  cancel-in-progress: false

permissions:
  # For the OIDC token that assumes the deploy role. No long-lived AWS keys in the repository —
  # `tofu/oidc.tf` trusts this workflow by repository and branch, not a secret somebody could copy.
  id-token: write
  contents: read
  # Publishing the image to GHCR, which authenticates with the job's own GITHUB_TOKEN. No registry
  # credential is stored anywhere: the token exists for the life of the run and GHCR trusts it
  # because it was issued for this repository.
  packages: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  NAME_PREFIX: ${{ vars.NAME_PREFIX }}

jobs:
  release:
    name: Build and upload
    # arm64 runners, because arm64 is what this ships to.
    #
    # Both halves of the release are architecture-specific and both were wrong on an x86 runner:
    #
    # - The router is a static `aarch64-unknown-linux-musl` binary. Cross-compiling it needs a C
    # toolchain for the target — `ring` has a build script — and the runner has none, so the build
    # died with `failed to find tool "aarch64-linux-musl-gcc"`. On arm64 this is a *native* musl
    # build and `musl-tools` is all it takes.
    # - The API's dependency tree contains per-platform optional binaries — 300 MB of
    # `@anthropic-ai/claude-agent-sdk` among them — and `pnpm deploy --prod` resolves them for the
    # host it runs on. An x86 runner would have quietly put `linux-x64` into a tarball bound for
    # Graviton, which is the same mistake a macOS laptop makes with `darwin-arm64` and just as
    # silent: nothing fails until the instance tries to run it.
    #
    # Building on the target architecture makes both correct by construction rather than by flag.
    runs-on: ubuntu-24.04-arm
    strategy:
      # Fail the whole release if either service fails to build. A half-released pair is worse than
      # no release: the cutover would move traffic to instances running one new service and one old.
      fail-fast: true
      matrix:
        service: ${{ (inputs.service || 'both') == 'both' && fromJSON('["website","router"]') || fromJSON(format('["{0}"]', inputs.service)) }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # No submodules. `vendor/android` and `vendor/deploy-action` are separate private
      # repositories, and the job's `GITHUB_TOKEN` is scoped to this one — checkout fails with
      # "Repository not found", which reads like the repository is missing rather than unreadable.
      #
      # Fetching them would need a cross-repository token, and neither is in this build: one is the
      # Android client, the other is the Action customers run in their own repositories. The website
      # and the router are built from this tree alone.
      - uses: actions/checkout@v5

      - id: version
        # The commit, not a timestamp or a run number: a release names the tree it was built from,
        # so "what is production running" and "what does that code do" are one lookup.
        run: echo "version=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build the router
        if: matrix.service == 'router'
        run: |
          # `ring` and `lz4` have build scripts that compile C. On an arm64 host this is a native
          # musl build, so the stock cross-compiler is all that is missing.
          sudo apt-get update -qq && sudo apt-get install -y musl-tools
          rustup target add aarch64-unknown-linux-musl
          cargo build --release --target aarch64-unknown-linux-musl -p router

      - name: Build the website and the API
        if: matrix.service == 'website'
        run: pnpm run build --filter=website --filter=@api/internal
        env:
          # Baked into the HTML at build time, so it cannot be changed by a later deploy step. Unset,
          # the website serves its own assets and everything still works — which is what makes this
          # safe to roll out before the bucket variable exists.
          NEXT_PUBLIC_ASSET_BASE: ${{ vars.ASSET_BASE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || format('https://api.{0}', vars.CONTROL_PLANE_DOMAIN || 'sproutos.me') }}
          NEXT_PUBLIC_HOST_URL: ${{ vars.NEXT_PUBLIC_HOST_URL || format('https://{0}', vars.CONTROL_PLANE_DOMAIN || 'sproutos.me') }}

      - name: Package
        run: |
          staging="$RUNNER_TEMP/stage"
          mkdir -p "$staging"

          if [ "${{ matrix.service }}" = "router" ]; then
            cp target/aarch64-unknown-linux-musl/release/router "$staging/router"
            printf '#!/bin/sh\nexec /opt/sproutos/router\n' > "$staging/start"
          else
            # Two processes in one release, because `api.<domain>` and the apex are served by the
            # same instances on different ports — see the `api` target group in `compute.tf`. They
            # ship together so a release can never leave the website on a new version and the API
            # on an old one.
            cp -r apps/website/.next/standalone/. "$staging/"

            # `.next/static` and `public/`, which standalone deliberately leaves out.
            #
            # Next's tracing excludes them because it assumes a CDN serves them, so the standalone
            # output is the server and its modules and nothing a browser downloads. Shipping only
            # that produces a site that renders, returns 200 for every page, and 404s every stylesheet
            # and chunk — the HTML is correct and the page is unstyled, which no health check and no
            # `curl` of `/` will ever notice.
            cp -r apps/website/.next/static "$staging/apps/website/.next/static"
            if [ -d apps/website/public ]; then
              cp -r apps/website/public "$staging/apps/website/public"
            fi

            mkdir -p "$staging/api"
            cp -r apps/internal-api/build/. "$staging/api/"

            # `pnpm deploy --prod`, not a copy of the workspace's `node_modules`.
            #
            # `build.mjs` bundles this app's own source but leaves real npm dependencies external —
            # deliberately, since `pg` and the AWS SDK resolve files relative to their own directory
            # and break when inlined. So the release does need a `node_modules`, but only the
            # production half: copying the workspace tree ships vitest, typescript and every other
            # dev dependency, which measured 1.2 GB against 500 MB for this.
            #
            # It also has to be resolved on the *target's* platform. Several dependencies have
            # per-platform optional binaries — `@anthropic-ai/claude-agent-sdk` is 300 MB of them —
            # and a tree resolved on a developer's macOS laptop puts `darwin-arm64` into a tarball
            # bound for Linux. This runner is Linux, which is the point of building here.
            #
            # `node-linker=hoisted`, because the bundle's dependencies are not this app's.
            #
            # esbuild inlines the workspace packages — `@lib/lambda`, `@lib/dao` and the rest — so
            # *their* npm dependencies become the bundle's, resolved from wherever `server.js`
            # sits. pnpm's default isolated layout links into the top-level `node_modules` only what
            # `apps/internal-api/package.json` itself declares, so the bundle started and died on
            # `Cannot find package '@aws-sdk/client-lambda'` — a package that was installed, three
            # directories away under `.pnpm`, and simply not resolvable from there.
            #
            # A hoisted layout puts every package at the top level, which is exactly the shape a
            # bundle needs. The alternative is to restate every transitive dependency of every
            # bundled workspace package in this app's own `dependencies`, and keep doing it.
            pnpm --filter=@api/internal deploy --prod --legacy \
              --config.node-linker=hoisted "$RUNNER_TEMP/apidep"
            cp -r "$RUNNER_TEMP/apidep/node_modules" "$staging/api/node_modules"

            # `wait -n` then exit, rather than backgrounding and returning: systemd's unit is
            # `Type=simple` with one `ExecStart`, so this script *is* the service. Returning while
            # children ran would have systemd call the service dead and restart it in a loop;
            # waiting for both would let one crashed process go unnoticed. Exiting when the first
            # child does makes systemd restart the pair, which is the only honest state — the
            # release is both processes or it is not running.
            #
            # Written line by line rather than with a heredoc: a heredoc's terminator has to sit at
            # column zero, and inside a YAML block scalar every line is already indented.
            {
              echo '#!/usr/bin/env bash'
              echo 'set -euo pipefail'
              echo 'node /opt/sproutos/api/server.js &'
              echo 'node /opt/sproutos/apps/website/server.js &'
              echo 'wait -n'
              echo 'exit 1'
            } > "$staging/start"
          fi

          chmod +x "$staging/start"
          tar -czf "$RUNNER_TEMP/${{ matrix.service }}.tar.gz" -C "$staging" .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.NAME_PREFIX }}-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Static assets to the CDN, before the release pointer moves.
      #
      # Ordering matters and is the same reason the tarball is uploaded before the pointer: the HTML
      # a running instance serves references these by hashed filename, so a browser must never be
      # able to ask for a chunk the CDN has not got yet. Publishing first makes the window empty
      # rather than small.
      #
      # `--cache-control immutable` because the names are content hashes: a changed asset is a new
      # key, never a new version of an old one, so nothing here can go stale.
      - name: Publish static assets
        if: matrix.service == 'website'
        run: |
          assets="${{ vars.ASSET_BUCKET }}"
          if [ -z "$assets" ]; then
            echo "::notice::ASSET_BUCKET is unset; the website will serve its own assets."
            exit 0
          fi

          aws s3 sync apps/website/.next/static "s3://$assets/_next/static" \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors

      - name: Upload
        run: |
          bucket="${{ vars.NAME_PREFIX }}-artifacts"
          version="${{ steps.version.outputs.version }}"

          # The tarball first, the pointer second. An instance that booted between the two would
          # otherwise read a pointer naming an object that is not there yet and fail its bootstrap.
          aws s3 cp "$RUNNER_TEMP/${{ matrix.service }}.tar.gz" \
            "s3://$bucket/releases/${{ matrix.service }}/$version.tar.gz"
          printf '%s' "$version" | aws s3 cp - \
            "s3://$bucket/releases/${{ matrix.service }}/current"

  image:
    name: Build and publish the image
    # arm64, because the instances are Graviton and a multi-arch build would spend most of its time
    # producing a variant nothing pulls.
    runs-on: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - id: meta
        run: |
          # Lowercased: image references are case-sensitive and the registry rejects an uppercase
          # path, while ${{ github.repository }} carries the repository's own casing.
          owner=$(echo "${{ github.repository_owner }}" | tr '"'"'[:upper:]'"'"' '"'"'[:lower:]'"'"')
          echo "image=ghcr.io/$owner/sproutos-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/website/Dockerfile
          platforms: linux/arm64
          push: true
          # Two tags: the commit, which is what a task definition should ever name, and `main`,
          # which is what a human looking at the registry expects to find. Deployments use the
          # commit — `main` moving under a running service is how you lose track of what is running.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ needs.release.outputs.version }}
            ${{ steps.meta.outputs.image }}:main
          # The registry as the layer cache. A code-only change then reuses the dependency layer
          # rather than rebuilding 500 MB of node_modules on a runner with a cold disk.
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max
    needs: release

  fill:
    name: Start the idle colour
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.NAME_PREFIX }}-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Scale the idle groups up and wait for health
        run: bin/fill-idle.sh
        env:
          LISTENER_ARN: ${{ vars.LISTENER_ARN }}
          WEBSITE_RULE_ARN: ${{ vars.WEBSITE_RULE_ARN }}
          # The API's rule moves with the website's — one release on two ports, so they can never be
          # different colours. `cutover.sh` requires it rather than defaulting, because a cutover
          # that silently moved only half of a deployment would point the API at the colour the
          # website had just drained.
          API_RULE_ARN: ${{ vars.API_RULE_ARN }}
          SERVICES: ${{ (inputs.service || 'both') == 'both' && 'website router' || inputs.service }}
          DESIRED: ${{ vars.SERVICE_DESIRED_COUNT || '2' }}

  cutover:
    name: Move traffic
    needs: fill
    # A push deploys all the way. A manual run keeps its opt-in, because the reason to dispatch by
    # hand is usually to stage something without moving traffic.
    if: ${{ github.event_name == 'push' || inputs.cutover }}
    runs-on: ubuntu-latest
    # A protected environment, so moving production traffic asks a person first. The release and
    # the fill do not: they change nothing that is serving.
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.NAME_PREFIX }}-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Cut over
        run: |
          for service in ${{ (inputs.service || 'both') == 'both' && 'website router' || inputs.service }}; do
            bin/cutover.sh "$service"
          done
        env:
          LISTENER_ARN: ${{ vars.LISTENER_ARN }}
          WEBSITE_RULE_ARN: ${{ vars.WEBSITE_RULE_ARN }}
          # The API's rule moves with the website's — one release on two ports, so they can never be
          # different colours. `cutover.sh` requires it rather than defaulting, because a cutover
          # that silently moved only half of a deployment would point the API at the colour the
          # website had just drained.
          API_RULE_ARN: ${{ vars.API_RULE_ARN }}
