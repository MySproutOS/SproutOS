name: Promote an existing CLI release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact immutable cli-vX.Y.Z release to verify and expose
        required: true
        type: string

concurrency:
  group: cli-release-production
  cancel-in-progress: false

permissions:
  contents: read
  attestations: read
  id-token: write

jobs:
  promote:
    name: Verify and promote production pointer
    runs-on: ubuntu-24.04
    # Publication and promotion are separate on purpose. Every production pointer change goes
    # through this CLI-only environment; the promotion role does not trust tag subjects directly.
    # Ordinary main deployments use `production`, which deliberately has no reviewer gate.
    environment: cli-release-production
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.NAME_PREFIX }}-cli-release-promotion
          aws-region: ${{ vars.AWS_REGION }}

      - name: Re-download, verify and record the release
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECS_TASK_DEFINITION_FILE: deploy/ecs/web-task-definition.json
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
          VERSION: ${{ inputs.version }}
        run: bin/promote-cli-release.sh "$VERSION" --record-only

      # Reuse the normal migration-first deploy authority to render the versioned task contract
      # with the image already serving. The CLI promotion role cannot register or select a task.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.NAME_PREFIX }}-deploy
          aws-region: ${{ vars.AWS_REGION }}
          unset-current-credentials: true

      - name: Read the immutable image currently serving
        id: serving-image
        run: |
          set -euo pipefail
          service=$(aws ecs describe-services --cluster "${{ vars.NAME_PREFIX }}" \
            --services "${{ vars.NAME_PREFIX }}-web" --output json)
          current=$(jq -r '.services[0].taskDefinition // empty' <<<"$service")
          test -n "$current"
          task=$(aws ecs describe-task-definition --task-definition "$current" --output json)
          mapfile -t images < <(jq -r '.taskDefinition.containerDefinitions[].image' <<<"$task" | sort -u)
          if [ "${#images[@]}" -ne 1 ] || ! [[ "${images[0]}" =~ :[0-9a-f]{12}$ ]]; then
            echo "serving task does not use one immutable 12-character Git SHA image" >&2
            exit 1
          fi
          echo "image=${images[0]}" >> "$GITHUB_OUTPUT"

      - name: Render website image
        id: render-website
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/ecs/web-task-definition.json
          container-name: website
          image: ${{ steps.serving-image.outputs.image }}

      - name: Render API image
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-website.outputs.task-definition }}
          container-name: api
          image: ${{ steps.serving-image.outputs.image }}

      - name: Render worker image
        id: render-worker
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          container-name: worker
          image: ${{ steps.serving-image.outputs.image }}

      - name: Render migration image
        id: render-migration
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/ecs/web-migrate-task-definition.json
          container-name: migrate
          image: ${{ steps.serving-image.outputs.image }}

      - name: Deploy the versioned SSM task contract without changing the image
        env:
          IMAGE: ${{ steps.serving-image.outputs.image }}
          SERVICE_TASK_DEFINITION_FILE: ${{ steps.render-worker.outputs.task-definition }}
          MIGRATION_TASK_DEFINITION_FILE: ${{ steps.render-migration.outputs.task-definition }}
          ECS_WEB_DESIRED_COUNT: "2"
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
        run: bin/deploy-ecs-web.sh

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.NAME_PREFIX }}-cli-release-promotion
          aws-region: ${{ vars.AWS_REGION }}
          unset-current-credentials: true

      - name: Prove ECS loaded the pointer and the public page exposes it
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
          CLI_DOWNLOAD_URL: https://${{ vars.CONTROL_PLANE_DOMAIN || 'sproutos.me' }}/download
          VERSION: ${{ inputs.version }}
        run: bin/promote-cli-release.sh "$VERSION"
