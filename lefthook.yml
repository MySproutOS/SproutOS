# Refer for explanation to following link:
# https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md

pre-commit:
  parallel: false
  commands:
    oxlint:
      glob: "*.{js,ts,jsx,tsx}"
      # `|| [ $? -eq 1 ]` would swallow real failures, so the empty case is detected instead.
      #
      # oxlint exits non-zero with "No files found to lint" when every staged file matching the glob
      # is in its own `ignorePatterns` — `apps/website/next.config.ts` is one. A commit touching only
      # such a file was refused by the hook while the file itself was perfectly fine, which reads as
      # a lint failure with no lint error in the output.
      run: |
        files=$(pnpm exec oxlint -c oxlint.config.mts --print-config >/dev/null 2>&1; echo "{staged_files}")
        pnpm exec oxlint -c oxlint.config.mts --fix {staged_files} 2>&1 | tee /tmp/oxlint.out
        status=${PIPESTATUS[0]}
        if [ "$status" -ne 0 ] && grep -q "No files found to lint" /tmp/oxlint.out; then
          echo "nothing to lint (all staged files are ignored by oxlint)"
          exit 0
        fi
        exit "$status"
      stage_fixed: true
    oxfmt:
      # Markdown included, because CI's `oxfmt --check` runs over the whole tree and this glob did
      # not. An ADR or a finding could therefore be committed unformatted, pass every hook, and fail
      # the format job — which then blocks the deploy of whatever else was in flight. Observed
      # exactly that way: a docs-only commit failed CI, and the two commits behind it did not deploy.
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,md}"
      run: pnpm exec oxfmt --config oxfmt.config.mts {staged_files}
      stage_fixed: true
    # CI runs `tofu fmt -check -recursive` and fails the whole run on a misaligned `=`. That is a
    # formatting nit that stops a deploy, and it had to be found from a red CI run rather than here
    # — which is the same argument the oxfmt hook above already makes.
    tofu-fmt:
      glob: "*.tf"
      run: tofu fmt {staged_files}
      stage_fixed: true
    tflint:
      glob: "tofu/*.tf"
      run: cd tofu && tflint
    rustfmt:
      glob: "*.rs"
      run: cargo fmt -- --check
    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets -- -D warnings
