[workspace]
resolver = "3"
members = [
  "lib/rust/srn",
  "lib/rust/metering-proto",
  "lib/rust/tenant-auth",
  "services/metering-agent",
  "services/pg-proxy",
  "services/valkey-proxy",
  "services/search-proxy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/Andrew-Chen-Wang/sproutos"

[workspace.dependencies]
sproutos-srn = { path = "lib/rust/srn" }
sproutos-metering-proto = { path = "lib/rust/metering-proto" }
sproutos-tenant-auth = { path = "lib/rust/tenant-auth" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v7", "serde"] }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
deadpool-postgres = "0.14"
rand = "0.8"
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
subtle = "2"
argon2 = { version = "0.5", features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
