# The stateful services SproutOS runs on its own hardware.
#
# Postgres is not here — that is Neon's, in AWS (ADR 0025). What is here is tenant search, tenant
# queues, and the log pipeline, on one machine with 125 GB of RAM and two NVMe drives.
#
# `bootstrap.sh` prepares the host; this file assumes it has run.

name: sproutos

services:
  # --- Tenant search -----------------------------------------------------------
  opensearch:
    container_name: sproutos_opensearch
    image: opensearchproject/opensearch:3.3.1
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - cluster.name=sproutos
      - node.name=sproutos-1
      # 30 GB, and not a byte more.
      #
      # Above roughly 32 GB the JVM stops using compressed ordinary object pointers, and a heap of
      # 40–50 GB is then needed to hold what fits in just under 32. The remaining ~90 GB of this
      # machine is not idle: Lucene reads its indexes through the page cache, which is where search
      # speed actually comes from.
      - OPENSEARCH_JAVA_OPTS=-Xms30g -Xmx30g
      - bootstrap.memory_lock=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      # The proxy is the security boundary — document- and field-level security is not in the
      # open-source distribution, so the plugin would give a false sense of one.
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    # **No `mem_limit`.** cgroup v2 counts page cache against a container's memory limit, so capping
    # this container caps Lucene's cache and silently undoes the heap reasoning above.
    volumes:
      - /srv/sproutos/opensearch:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"

    # Reachable from AWS, because `search-proxy` — the thing that makes this multi-tenant — runs in
    # the router there. Bound to `127.0.0.1` and nothing else until now, which meant the search
    # split could not have worked in production: `SERVICE_SEARCH_PUBLIC_HOST` had no valid value.
    #
    # The port stays on loopback; what is published is a Traefik route on 443, exactly as ClickHouse
    # is, joining the network the forum's Traefik watches so neither this file nor that repository
    # has to know about the other.
    networks:
      - default
      - forum_default
    labels:
      traefik.enable: "true"
      traefik.docker.network: forum_default
      traefik.http.routers.opensearch.entrypoints: websecure
      traefik.http.routers.opensearch.rule: Host(`opensearch.sproutos.me`)
      traefik.http.routers.opensearch.tls.certresolver: le
      traefik.http.services.opensearch.loadbalancer.server.port: "9200"
      # Two locks, and here the second one is not optional — it is the *only* one that works.
      #
      # ClickHouse can lean on an allowlist because ClickHouse also has a user and a password.
      # OpenSearch runs with `DISABLE_SECURITY_PLUGIN=true` and authenticates nobody, so an
      # allowlist alone would be one lock on nothing: tenant Lambdas egress through the same NAT
      # address the allowlist has to admit, which would let every tenant read every other tenant's
      # index by talking to this directly and skipping the proxy entirely.
      #
      # So the door gets a password of its own, held only by `search-proxy`, presented as
      # `SEARCH_PROXY_UPSTREAM_AUTHORIZATION`. The tenant's own `Authorization` header is stripped
      # before this one is set — see `services/search-proxy/src/lib.rs`.
      traefik.http.routers.opensearch.middlewares: opensearch-allowlist,opensearch-auth
      # **Every `$` in the bcrypt hash must be doubled in `.env`.** Compose interpolates the value it
      # reads from there, so `$2y$05$Kq…` has `$05` and `$Kq…` taken as variable references and
      # substituted with nothing — leaving `u:$2y` on the label. Traefik then rejects every
      # credential, and the truncation is visible nowhere: `docker compose config` prints the
      # mangled value with its own `$$` escaping on top, which reads like the correct answer.
      # Measured: `.env` holding `u:$2y$05$abcdefgHIJKLmnop` produced the label `u:$2y$05`.
      traefik.http.middlewares.opensearch-auth.basicauth.users: ${SEARCH_BASICAUTH_USERS:?set SEARCH_BASICAUTH_USERS}
      # Same two families and the same reasoning as ClickHouse below — except that this name has no
      # AAAA record for the reason `tofu/dns.tf` gives, so in practice only the first line is ever
      # matched. It is kept because the day Docker IPv6 is enabled on this host is the day the
      # record comes back, and an allowlist that quietly did not cover it would fail closed at 3am.
      traefik.http.middlewares.opensearch-allowlist.ipallowlist.sourcerange: "54.160.27.183/32,2600:1f18:2936:ae00::/56"

  # --- Tenant queues -----------------------------------------------------------
  #
  # Two processes, not one with two databases. `maxmemory-policy` is per-process and `SELECT n`
  # gives no memory isolation, so a single instance cannot be both "never lose a job" and "evict
  # the coldest key".
  valkey-queue:
    container_name: sproutos_valkey_queue
    image: valkey/valkey:9.0-alpine
    restart: unless-stopped
    command:
      - valkey-server
      - --maxmemory
      - 8gb
      # `noeviction`: a pending job is a customer's work, and evicting one to make room is losing
      # it silently. When this fills, writes are refused — which is loud, and correct.
      - --maxmemory-policy
      - noeviction
      # Queues are durable state. `appendonly` costs write throughput and buys not losing the last
      # second of enqueues to a crash.
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # The second lock. See the Traefik labels below for why one is not enough, and
      # `services/valkey-proxy/src/upstream.rs` for the half that holds the key.
      - --requirepass
      - ${VALKEY_QUEUE_PASSWORD:?set VALKEY_QUEUE_PASSWORD}
    volumes:
      - /srv/sproutos/valkey-queue:/data
    ports:
      - "127.0.0.1:6379:6379"

    # **Not reachable from AWS, and this is where that stopped.**
    #
    # The obvious route was a Traefik TCP router on `websecure`: RESP is not HTTP, but Traefik
    # multiplexes TCP and HTTP on one entrypoint by SNI, so it would have shared 443 with the forum
    # and needed no entrypoint added — which matters, because entrypoints are command-line flags and
    # those live in the forum's repository.
    #
    # It was tried, and it took the whole host's certificate renewal down with it. A TCP router with
    # TLS on an entrypoint stops Traefik answering the `acme-tls/1` ALPN there, so Let's Encrypt's
    # `tls-alpn-01` challenge fails for **every** domain on 443, not only the new one:
    #
    #     Cannot negotiate ALPN protocol "acme-tls/1" for tls-alpn-01 challenge
    #
    # Measured both ways. With the TCP router present, `opensearch.sproutos.me` failed five
    # authorizations and hit Let's Encrypt's rate limit; with it removed and nothing else changed,
    # the certificate issued within ninety seconds. The forum's own `s3.forum` and `static.forum`
    # names were failing the same way at the same time.
    #
    # The trap is the shape, not the outage. An existing certificate keeps working, so the cost is
    # invisible until a renewal sixty days later takes out the forum, ClickHouse and search at once,
    # for a change nobody would connect to it.
    #
    # `requirepass` above is set regardless. It is the lock that has to hold whatever the transport
    # turns out to be, and setting it now means the day this is published is not also the day it
    # first gets a password.

  valkey-cache:
    container_name: sproutos_valkey_cache
    image: valkey/valkey:9.0-alpine
    restart: unless-stopped
    command:
      - valkey-server
      - --maxmemory
      - 8gb
      # A cache may forget. That is the difference from the instance above, and it is why they are
      # two processes.
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    volumes:
      - /srv/sproutos/valkey-cache:/data
    ports:
      - "127.0.0.1:6380:6379"

  # --- The log pipeline, on the second NVMe ------------------------------------
  #
  # Kafka's hardware guide asks not to share its data drive with other filesystem activity, and
  # ClickHouse merges are the noisiest neighbour available. Hence `/data` for both, and `/` for
  # everything above.
  kafka:
    container_name: sproutos_kafka
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      # KRaft combined mode. ZooKeeper was removed entirely in Kafka 4.0, so there is no decision
      # left to make — but Kafka's own docs call combined mode unsuitable for critical deployments,
      # and that is accepted here rather than hidden: a single-host Kafka is already a single point
      # of failure, and this is a log buffer rather than a system of record.
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      # Two listeners with two different security postures, because they face different things.
      #
      # PLAINTEXT is the Docker network — ClickHouse's consumer and anything run with `docker exec`.
      # It never leaves the host, and its principal is ANONYMOUS.
      #
      # EXTERNAL is the public internet. The log extension runs inside customers' Lambda execution
      # environments in AWS and has no fixed address to allowlist, so the boundary cannot be a
      # firewall rule — it is TLS for the broker's identity and SASL/SCRAM for the producer's.
      # ADR 0026 already accepted that AWS reaches this box across the internet; this is that
      # crossing done with both ends authenticated.
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      # The advertised name must match the certificate, and it is the name the client verifies.
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://kafka.sproutos.me:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:SASL_SSL
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # SCRAM, not PLAIN. PLAIN sends the password itself and relies entirely on the TLS layer;
      # SCRAM never puts it on the wire and the broker stores a salted verifier rather than
      # anything replayable. SHA-512 because rskafka — the extension's client — implements it.
      - KAFKA_SASL_ENABLED_MECHANISMS=SCRAM-SHA-512
      - KAFKA_LISTENER_NAME_EXTERNAL_SASL_ENABLED_MECHANISMS=SCRAM-SHA-512
      # The login module for that mechanism, which Kafka will not start without: enabling a SASL
      # mechanism and not saying how to authenticate it is a fatal error at boot, not a warning
      # ("Could not find a 'KafkaServer' or 'external.KafkaServer' entry in the JAAS configuration").
      #
      # The triple underscores are the image's escaping, not a typo: it lowercases the name, maps
      # `_` to `.` and `___` to `-`, so this is
      # `listener.name.external.scram-sha-512.sasl.jaas.config`. No credentials appear here — the
      # module reads them from the cluster's own SCRAM store, which is where `kafka-configs.sh`
      # writes a salted verifier rather than a password.
      - "KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG=org.apache.kafka.common.security.scram.ScramLoginModule required;"
      # PEM rather than JKS: Kafka 4 reads it directly, so the certbot renewal is the whole rotation
      # and there is no keytool step to forget. The file is the private key followed by the chain.
      - KAFKA_SSL_KEYSTORE_TYPE=PEM
      - KAFKA_SSL_KEYSTORE_LOCATION=/etc/kafka/tls/keystore.pem
      # Authentication alone would let any authenticated producer read every topic. The authorizer
      # is what makes the log credential a *log* credential.
      - KAFKA_AUTHORIZER_CLASS_NAME=org.apache.kafka.metadata.authorizer.StandardAuthorizer
      # The local listener's principal, so ClickHouse's consumer and administration keep working
      # without an ACL each. Nothing outside the Docker network can present it: the external
      # listener requires SASL, and an unauthenticated connection there is rejected before it has a
      # principal at all.
      - KAFKA_SUPER_USERS=User:ANONYMOUS
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      # Logs are consumed within seconds and kept for three days in ClickHouse. Kafka is the buffer,
      # not the archive, so it holds a day and no more.
      - KAFKA_LOG_RETENTION_HOURS=24
      - KAFKA_HEAP_OPTS=-Xms4g -Xmx6g
    volumes:
      - /data/sproutos/kafka:/var/lib/kafka/data
      - /data/sproutos/kafka-tls:/etc/kafka/tls:ro
    ports:
      - "127.0.0.1:9092:9092"
      # Bound to every interface, unlike everything else on this box. That is the point of it and
      # it is why the listener above requires SASL and TLS.
      - "9094:9094"

  clickhouse:
    container_name: sproutos_clickhouse
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      - CLICKHOUSE_DB=sproutos
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-sproutos}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - /data/sproutos/clickhouse:/var/lib/clickhouse
      - /data/sproutos/clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"

    # Reachable from AWS, because the API reads customers' runtime logs from here.
    #
    # This bound to 127.0.0.1 and nothing else, which meant `GET /:orgSlug/projects/:projectId/logs`
    # — the log viewer — could not have worked in production. The port stays on loopback; what is
    # published is a Traefik route on 443, which the box already runs for the forum.
    #
    # Traefik's docker provider discovers by label, so this needs no change to the forum's own
    # repository: joining the network it watches is enough. `forum_default` is declared external
    # below for that reason.
    networks:
      - default
      - forum_default
    labels:
      traefik.enable: "true"
      traefik.docker.network: forum_default
      traefik.http.routers.clickhouse.entrypoints: websecure
      traefik.http.routers.clickhouse.rule: Host(`clickhouse.sproutos.me`)
      traefik.http.routers.clickhouse.tls.certresolver: le
      traefik.http.services.clickhouse.loadbalancer.server.port: "8123"
      # Two locks, not one. ClickHouse's own user and password still apply; this restricts *who may
      # reach the door* to the AWS estate. A password is what stops a wrong caller; an allowlist is
      # what stops the internet knocking at all — and it knocks: this host had scanners probing
      # `/debug/default/view?panel=config` within a minute of the DNS record existing.
      #
      # **Both families, and the second is not optional.** The VPC is dual-stack, so an instance
      # resolving this name gets the AAAA record and prefers IPv6 — which leaves through the
      # egress-only gateway and *never touches the NAT*. Its source is therefore an address from the
      # VPC's own /56, not the NAT's Elastic IP, and an IPv4-only allowlist rejects every request
      # the platform actually makes while appearing to be configured correctly. Measured: 403 over
      # IPv6, 200 over `curl -4`, from the same instance in the same second.
      #
      # 54.160.27.183  — the NAT's Elastic IP, which is all IPv4 egress from the private subnets.
      # 2600:1f18:2936:ae00::/56 — the VPC's IPv6 block, which is all IPv6 egress from them.
      traefik.http.routers.clickhouse.middlewares: clickhouse-allowlist
      traefik.http.middlewares.clickhouse-allowlist.ipallowlist.sourcerange: "54.160.27.183/32,2600:1f18:2936:ae00::/56"

networks:
  default:
  # Traefik's network, created by the forum's compose project. External because that stack owns it
  # and this one only joins — declaring it here would have Docker try to create a second network
  # with the same name and fail.
  forum_default:
    external: true
